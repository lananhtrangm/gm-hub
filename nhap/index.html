  <style>
/* Giao diện mới: nền trắng, menu XANH LÁ ĐẬM, điểm nhấn VÀNG ĐẬM, chữ to & đậm */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --line:#E3E7E1; --field:#F7F9F6; --field-line:#CFD6CC;
  --ink:#1D6340; --ink2:#267550; --ink-text:#EAF3EC; --ink-muted:#B9D6C3;
  --pri:#E8A21E; --pri-hover:#D69214; --pri-ink:#1A1200; --soft:#FFF0C9; --soft-ink:#5E3D00; --accent:#E8A21E;
  --text:#14201A; --text2:#33413A; --muted:#5D6862;
  --ok-bg:#E2F2E7; --ok:#1F6B3E; --warn-bg:#FFEACC; --warn:#8A4B00; --bad-bg:#FDE3E1; --bad:#A1251C;
  --nav-w:232px;
  --surface:#FFFFFF; --hi:var(--hi); --on-ink:#FFFFFF; --track:var(--track); --tint:var(--tint); --tabs-bg:var(--tabs-bg); --th-bg:var(--th-bg); --need-bg:var(--need-bg); --dash:var(--dash);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;font-weight:500}
a{color:#8A5D00;font-weight:600}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.bold{font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(90,62,43,.06)}
.card h3{margin:0 0 8px;font-size:17px;font-weight:800;color:var(--text)}
.title{font-size:23px;font-weight:800;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pri)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.chip.soft{background:var(--soft);color:var(--soft-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.dark{background:var(--ink);color:var(--on-ink)}
/* Ô số liệu kiểu thẻ */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(90,62,43,.06)}
.stat .lb{font-size:13px;font-weight:700;color:var(--text2)}
.stat .v{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.hi{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.stat.hi .lb{color:var(--ink-text)} .stat.hi .s{color:var(--ink-muted)} .stat.hi .v{color:var(--hi)}
@media (min-width:700px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr))} }
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--text2)}
.in{height:50px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--field);padding:0 14px;font-size:16px;font-weight:600;min-width:0;width:100%}
.in:focus{outline:2px solid var(--pri);outline-offset:0;background:var(--surface)}
.btn{height:52px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--surface);padding:0 18px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#BFC5B8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:800}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.danger{color:var(--bad);border-color:#F2C1BC}
.btn.sm{height:42px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:46px;height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text)}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>div{height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.tabs{display:flex;gap:6px;background:var(--tabs-bg);padding:4px;border-radius:12px;align-self:flex-start}
.tab{height:42px;padding:0 16px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--text2);cursor:pointer}
.tab.on{background:var(--ink);color:var(--on-ink)}
.lotcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;transition:border-color .15s}
.lotcard:hover{border-color:var(--pri)}
.sku{display:flex;flex-direction:column;gap:5px}

/* Dòng nhỏ "Đang cập nhật…" khi app lấy dữ liệu mới ngầm phía sau */
var syncCount = 0;
function syncing(on) {
  syncCount = Math.max(0, syncCount + (on ? 1 : -1));
  var el = $('sync'); if (el) el.hidden = syncCount === 0;
}
/* Đang gõ trong ô nhập thì không vẽ lại màn hình (tránh mất chữ đang gõ) */
function editing() {
  var a = document.activeElement;
  return !!(a && $('app').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function lotsKey() { return 'godfbs_lots_' + (S.user ? S.user.username : ''); }

function isAdmin() { return S.user && S.user.role === 'admin'; }
function pct(a, b) { return b ? Math.min(100, Math.round(a * 100 / b)) : 0; }
function render(html, keep) {
  var y = window.scrollY;
  $('app').innerHTML = html; window.scrollTo(0, keep ? y : 0);
  document.body.classList.toggle('hasnav', html.indexOf('<nav class="bottom"') >= 0);
}

function nav(active) {
  return '<nav class="bottom">' +
    '<div class="brand">' + ICON.logoSm + '<div><div class="nm">GOD - FBS</div><div class="sb">Đóng bao Shopee FBS</div></div></div>' +
    '<button type="button" class="' + (active === 'lots' ? 'on' : '') + '" onclick="goHome()">' + '<span class="navno">01</span>' + ICON.box + 'Đóng hàng FBS</button>' +
    (isAdmin() ? '<button type="button" class="' + (active === 'users' ? 'on' : '') + '" onclick="go(\'users\')">' + '<span class="navno">02</span>' + ICON.user + 'Tài khoản</button>' : '') +
    '<button type="button" onclick="logout()">' + '<span class="navno"></span>' + ICON.out + 'Đăng xuất</button>' +
    '<div class="navfoot">' + esc(S.user ? S.user.hoTen : '') + '<br>' + (isAdmin() ? 'Quản trị' : 'Nhân viên') + ' · Kho Godmother</div></nav>';
}

/* ===================== KHỞI ĐỘNG ===================== */
window.addEventListener('beforeunload', function (e) {
  if (S.uploading) { e.preventDefault(); e.returnValue = ''; }
});

function boot() {
  S.token = load('godfbs_token');
  if (S.token) {
    call('me', {}, { quiet: true, silent: true }).then(function (d) {
      S.user = d.user; S.tinhTrang = d.tinhTrang; S.kho = load('godfbs_kho'); go('lots');
    }).catch(function () { logoutLocal(); });
  } else {
    call('status', {}, { quiet: true }).then(function (d) {
      if (d.hasUsers) viewLogin(); else viewSetup();
    });
  }
}

function logoutLocal() { if (S.user) store(lotsKey(), null); S.token = null; S.user = null; S.lots = []; S.lotCache = {}; store('godfbs_token', null); viewLogin(); }
function logout() {
  (S.uploading ? ask('Video đang tải lên. Vẫn đăng xuất?') : Promise.resolve(true)).then(function (ok) {
    if (!ok) return;
    call('logout', {}, { quiet: true, silent: true }).catch(function () {});
    logoutLocal();
  });
}

function afterLogin(d) {
  S.kho = load('godfbs_kho');
  S.token = d.token; S.user = d.user; S.tinhTrang = d.tinhTrang || S.tinhTrang;
  store('godfbs_token', d.token);
  go('lots');
}

function go(view, arg) {
  if (S.bag && view !== 'bag') {
    if (S.uploading) { toast('Video đang tải lên, vui lòng chờ xong.', true); return; }
    S.bag = null;   // bao nháp vẫn giữ trên máy chủ, bấm "Đóng bao mới" để làm tiếp số bao đó
  }
  S.view = view;
  if (view === 'lots') return loadLots();
  if (view === 'lot') { S.lotId = arg || S.lotId; return loadLot(); }
  if (view === 'import') return viewImport();
  if (view === 'users') return loadUsers();
}

/* ===================== DANH SÁCH LÔ ===================== */
/* Hiện ngay danh sách đã nhớ, rồi lấy bản mới ngầm phía sau */
function loadLots() {
  var cached = S.lots && S.lots.length ? S.lots : null;
  if (!cached) { try { cached = JSON.parse(load(lotsKey()) || 'null'); } catch (e) { cached = null; } }
  if (cached) { S.lots = cached; viewLots(); syncing(true); }
  call('listLots', {}, cached ? { quiet: true, silent: true } : { text: 'Đang tải lô hàng…' }).then(function (lots) {
    if (cached) syncing(false);
    var changed = !cached || !same(lots, S.lots);
    S.lots = lots; store(lotsKey(), JSON.stringify(lots));
    if (S.view === 'lots' && changed && !editing()) viewLots(!!cached);
    prefetchLots(lots);
  }).catch(function () {
    if (!cached) return;
    syncing(false); toast('Chưa cập nhật được danh sách lô (mất kết nối).', true);
  });
}
/* Tải sẵn ngầm vài lô đang đóng để bấm vào là mở ngay */
function prefetchLots(lots) {
  var ids = lots.filter(function (l) { return l.status !== 'done' && !S.lotCache[l.lotId]; })
    .slice(0, 3).map(function (l) { return l.lotId; });
  (function next() {
    var id = ids.shift(); if (!id) return;
    call('getLot', { lotId: id }, { quiet: true, silent: true })
      .then(function (d) { if (!S.lotCache[id]) S.lotCache[id] = d; next(); })
      .catch(function () {});
  })();
}
function setTab(t) { S.tab = t; viewLots(); }

/* ===================== MỤC 01: ĐÓNG HÀNG FBS ===================== */
function goHome() { S.kho = null; store('godfbs_kho', null); go('lots'); }
function openKho(k) { S.kho = k; S.tab = 'open'; store('godfbs_kho', k); viewLots(); }
function khoSum(lots) {
  var open = lots.filter(function (l) { return l.status !== 'done'; });
  var r = { open: open.length, done: lots.length - open.length, can: 0, dong: 0, bao: 0 };
  open.forEach(function (l) { r.can += l.slCan; r.dong += l.slDong; r.bao += l.bagCount; });
  return r;
}
function viewFbsHome(keep) {
  var cards = ['VNNL', 'VNVL'].map(function (k) {
    var t = khoSum(S.lots.filter(function (l) { return l.kho === k; }));
    return '<button type="button" class="card lotcard khocard" onclick="openKho(\'' + k + '\')">' +
      '<div class="row between"><div class="row" style="gap:12px"><div class="khoicon">' + ICON.box + '</div>' +
      '<div><div class="khoname">' + KHO_TEN[k] + '</div><div class="muted small">Mã kho ' + k + '</div></div></div>' +
      '<span class="chip ' + (t.open ? 'soft' : 'ok') + '">' + (t.open ? t.open + ' PO đang đóng' : 'Không có PO đang đóng') + '</span></div>' +
      '<div class="need"><div>Đã đóng<b>' + t.dong.toLocaleString('vi-VN') + '</b></div><div>Cần đóng<b>' + t.can.toLocaleString('vi-VN') + '</b></div><div class="left">Số bao<b>' + t.bao + '</b></div></div>' +
      '<div class="bar"><div style="width:' + pct(t.dong, t.can) + '%"></div></div>' +
      '<div class="row between small muted khofoot"><span>' + t.done + ' PO đã xong</span><span class="bold" style="color:var(--ink)">Mở ' + KHO_TEN[k] + ' →</span></div></button>';
  }).join('');
  render('<div class="wrap stack home">' +
    '<div class="row between"><div><div class="eyebrow">Mục 01</div><div class="title">Đóng Hàng FBS</div>' +
    '<div class="muted small hello1">Xin chào, ' + esc(S.user.hoTen) + ' · chọn kho để làm việc</div></div>' +
    '<span class="chip soft">' + (isAdmin() ? 'Quản trị' : 'Nhân viên') + '</span></div>' +
    '<div class="khogrid">' + cards + '</div>' +
    (isAdmin() ? '<button type="button" class="drop" onclick="go(\'import\')" style="color:var(--pri-ink)">' + ICON.up +
      '<div class="bold">Tải file gốc của lần xuất mới</div><div class="muted small dropsub">PO sẽ tự vào đúng Kho HN hoặc Kho HCM</div></button>' : '') +
    '</div>' + nav('lots'), keep);
}
function lotStats(open, done) {
  var can = 0, dong = 0, bao = 0;
  open.forEach(function (l) { can += l.slCan; dong += l.slDong; bao += l.bagCount; });
  function t(lb, v, s, hi) { return '<div class="stat' + (hi ? ' hi' : '') + '"><div class="lb">' + lb + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
  return '<div class="stats">' +
    t('Lô đang đóng', open.length, 'Chưa hoàn tất', true) +
    t('Đã đóng', dong.toLocaleString('vi-VN'), 'trên ' + can.toLocaleString('vi-VN') + ' pcs cần đóng') +
    t('Số bao đã chốt', bao, 'Của các lô đang đóng') +
    t('Lô đã xong', done.length, 'Đã hoàn tất') + '</div>';
}
function viewLots(keep) {
  if (!KHO_TEN[S.kho]) return viewFbsHome(keep);
  var mine = S.lots.filter(function (l) { return l.kho === S.kho; });
  var open = mine.filter(function (l) { return l.status !== 'done'; });
  var done = mine.filter(function (l) { return l.status === 'done'; });
  var list = S.tab === 'open' ? open : done;
  var cards = list.map(function (l) {
    return '<button type="button" class="card lotcard" onclick="go(\'lot\',\'' + esc(l.lotId) + '\')">' +
      '<div class="row between" style="align-items:flex-start"><div><div class="muted small">Mã PO</div>' +
      '<div class="bold" style="font-size:14px;word-break:break-all">' + esc(poName(l)) + '</div></div>' +
      (l.han ? '<span class="chip warn">Hạn ' + esc(l.han) + '</span>' : '') + '</div>' +
      '<div class="row wrapflex small" style="color:var(--text2);gap:14px"><span>' + esc(l.kho) + '</span><span>' + l.skuCount + ' SKU</span><span>' + l.bagCount + ' bao</span></div>' +
      '<div class="stack" style="gap:6px"><div class="bar"><div style="width:' + pct(l.slDong, l.slCan) + '%"></div></div>' +
      '<div class="row between small muted"><span>Đã đóng ' + l.slDong + ' / ' + l.slCan + ' pcs</span><span>ASN: ' + (l.asn ? esc(l.asn) : 'chưa nhập') + '</span></div></div>' +
      '</button>';
  }).join('');
  render('<div class="wrap stack">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Về Đóng Hàng FBS" onclick="goHome()">' + ICON.back + '</button>' +
    '<div class="grow"><div class="eyebrow">Đóng Hàng FBS</div><div class="title">' + KHO_TEN[S.kho] + '</div></div>' +
    '<span class="chip soft">' + S.kho + '</span></div>' +
    lotStats(open, done) +
    '<div class="tabs"><button type="button" class="tab ' + (S.tab === 'open' ? 'on' : '') + '" onclick="setTab(\'open\')">Đang đóng (' + open.length + ')</button>' +
    '<button type="button" class="tab ' + (S.tab === 'done' ? 'on' : '') + '" onclick="setTab(\'done\')">Đã xong (' + done.length + ')</button></div>' +
    (cards || '<div class="card center muted">' + KHO_TEN[S.kho] + ' chưa có PO nào ' + (S.tab === 'open' ? 'đang đóng' : 'đã xong') + '.</div>') +
    (isAdmin() ? '<button type="button" class="drop" onclick="go(\'import\')" style="color:var(--pri-ink)">' + ICON.up +
      '<div class="bold">Tải file gốc của lần xuất mới</div><div class="muted small">Dán link Google Sheet file gốc</div></button>' : '') +
    '</div>' + nav('lots'), keep);
}

function readSource() {
  var url = $('iu').value.trim();
  if (!url) return toast('Chưa dán link.', true);
  call('previewSource', { url: url }, { text: 'Đang đọc file…' }).then(function (d) {
    S.importInfo = { url: url, title: d.title, sheets: d.sheets }; viewImport();
  });

function pickSheet(name) {
  var s = S.importInfo.sheets.filter(function (x) { return x.name === name; })[0];

}
function doImport() {

    .then(function (d) { S.importInfo = null; toast('Đã tải lô hàng.'); go('lot', d.lotId); });

/* ===================== CHI TIẾT LÔ ===================== */
/** Hiện lô từ dữ liệu máy chủ trả về luôn, khỏi gọi tải lại lần 2. */
function showLot(d) {
  if (!d || !d.lot) { S.view = 'lot'; return loadLot(); }
  S.lotId = d.lot.lotId; S.view = 'lot'; S.detail = d; S.lotCache[d.lot.lotId] = d; viewLot();
}
/** Ghi file gốc ngầm phía sau, chỉ báo khi có lỗi. */
function syncLot(lotId) {
  call('syncLot', { lotId: lotId }, { quiet: true, silent: true }).then(function (r) {
    if (r && r.error) toast('Chưa ghi được vào file gốc: ' + r.error + ' (Quản trị bấm "Ghi vào file gốc" để ghi lại.)', true);
  }).catch(function () { toast('Chưa ghi được vào file gốc (mất kết nối). Quản trị bấm "Ghi vào file gốc" để ghi lại.', true); });
}
/* Mở ngay lô đã nhớ, rồi lấy bản mới ngầm phía sau */
function loadLot() {
  var id = S.lotId, cached = S.lotCache[id];
  if (cached) { S.detail = cached; viewLot(); syncing(true); }
  call('getLot', { lotId: id }, cached ? { quiet: true, silent: true } : { text: 'Đang tải lô…' }).then(function (d) {
    if (cached) syncing(false);
    S.lotCache[id] = d;
    if (S.view !== 'lot' || S.lotId !== id || S.bag) return;
    var changed = !cached || !same(d, S.detail);
    S.detail = d;
    if (changed && !editing()) viewLot(!!cached);
  }).catch(function () {
    if (!cached) return;
    syncing(false); toast('Chưa cập nhật được lô (mất kết nối).', true);
  });
}

function skuChip(i, lotDone) {
  if (i.slDong >= i.slCan && i.slCan > 0) return '<span class="chip ok">Đã đủ</span>';
  if (i.slDong > 0) return '<span class="chip soft">Đang đóng</span>';
  if (lotDone) return '<span class="chip bad">Thiếu hàng</span>';
  return '<span class="chip warn">Chưa đóng</span>';
}

function viewLot(keep) {
  if (S.detail && S.detail.lot && KHO_TEN[S.detail.lot.kho]) { S.kho = S.detail.lot.kho; store('godfbs_kho', S.kho); }
  var d = S.detail, l = d.lot, done = l.status === 'done';
  var slCan = 0, slDong = 0;
  d.items.forEach(function (i) { slCan += i.slCan; slDong += i.slDong; });

  var info = isAdmin()
    ? '<div class="grid2"><label class="f">Mã PO<input class="in" id="lpo" value="' + esc(l.po) + '"></label>' +
      '<label class="f">ASN<input class="in" id="lasn" value="' + esc(l.asn) + '" placeholder="Nhập mã ASN"></label></div>' +
      '<label class="f">Kho nhận<select class="in" id="lkho">' + d.khoList.map(function (k) {
        return '<option value="' + k.code + '"' + (k.code === l.kho ? ' selected' : '') + '>' + esc(k.text) + '</option>';
      }).join('') + '</select></label>' +
      '<button type="button" class="btn sm" onclick="saveLotInfo()">Lưu thông tin lô</button>'
    : '<div class="grid2"><div><div class="muted small">ASN</div><div class="bold">' + esc(l.asn || 'chưa nhập') + '</div></div>' +
      '<div><div class="muted small">Kho nhận</div><div class="bold">' + esc(l.kho) + '</div></div></div>';

  var items = d.items.map(function (i) {
    return '<div class="card sku"><div class="row between" style="align-items:flex-start"><div class="grow">' +

      skuChip(i, done) + '</div><div class="row between small" style="color:var(--text2)"><span>Đóng ' + i.slDong + ' / ' + i.slCan + ' pcs</span>' +
      '<span>' + (i.maKien ? 'Kiện ' + esc(i.maKien) : '') + '</span></div></div>';

  var bags = d.bags.map(function (b) {
    return '<tr><td>' + b.baoNo + '</td><td>' + esc(b.barcode) + '</td><td class="num">' + b.qty + '</td><td>' + esc(b.tinhTrang) + '</td>' +
      '<td>' + esc(b.user) + '</td><td>' + esc(b.createdAt) + '</td>' +
      (isAdmin() ? '<td>' + (b.cleaned ? '<span class="muted">Đã xóa sau 30 ngày</span>' :
        '<a href="' + esc(b.videoUrl) + '" target="_top">Xem video</a> · <a href="' + esc(b.folderUrl) + '" target="_top">Ảnh</a>') +
        (!done ? ' · <a href="#" onclick="delBag(\'' + esc(b.bagId) + '\',' + b.baoNo + ');return false" style="color:var(--bad)">Xóa</a>' : '') + '</td>'
        : '<td>' + evidenceChip(b) + '</td>') + '</tr>';
  }).join('');

  var drafts = d.drafts.length ? '<div class="muted small">Đang đóng dở: ' + d.drafts.map(function (x) { return 'bao ' + x.baoNo + ' (' + esc(x.user) + ')'; }).join(', ') + '</div>' : '';

  var pxk = '';
  if (isAdmin()) {
    var rows = d.items.filter(function (i) { return i.slDong > 0; }).map(function (i, k) {
      return '<tr><td>' + (k + 1) + '</td><td>' + esc(i.sku) + '</td><td>' + esc(i.ten) + '</td><td>' + esc(i.phanLoai) + '</td><td>pcs</td>' +
        '<td class="num">' + i.slCan + '</td><td class="num">' + i.slDong + '</td><td class="num">' + i.soKien + '</td><td>' + esc(i.maKien) + '</td><td>' + esc(i.ghiChu) + '</td></tr>';
    }).join('');
    pxk = '<div class="card stack"><div class="row between wrapflex"><h3 style="margin:0">Xem trước phiếu xuất kho</h3>' +
      '<span class="muted small">SKU chưa đóng / thiếu hàng không đưa vào phiếu</span></div>' +
      '<div class="tablebox"><table class="t"><thead><tr><th>STT</th><th>Mã SKU</th><th>Tên sản phẩm</th><th>Phân loại</th><th>ĐVT</th>' +
      '<th class="num">SL xác nhận</th><th class="num">SL giao</th><th class="num">SL kiện</th><th>Mã kiện</th><th>Ghi chú</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="10" class="muted">Chưa có bao nào.</td></tr>') + '</tbody></table></div>' +
      '<div class="row wrapflex">' +
      '<button type="button" class="btn" onclick="doWriteBack()">Ghi vào file gốc</button>' +
      '<button type="button" class="btn pri" onclick="doExport()">Xuất phiếu xuất kho</button>' +
      (done ? '<button type="button" class="btn" onclick="setLotStatus(\'open\')">Mở lại lô</button>'
            : '<button type="button" class="btn" onclick="setLotStatus(\'done\')">Hoàn tất lô</button>') +
      '<button type="button" class="btn danger" onclick="deleteLot()">Xóa lô khỏi phần mềm</button></div>' +
      '<div class="row wrapflex small">' +
      (l.pxkUrl ? '<a href="' + esc(l.pxkUrl) + '" target="_top">Mở phiếu xuất kho vừa xuất</a>' : '') +
      '<a href="' + esc(l.srcUrl) + '" target="_top">Mở file gốc</a>' +
      '<a href="' + esc(l.folderUrl) + '" target="_top">Thư mục video & ảnh</a></div></div>';
  }

  render('<div class="wrap stack" style="padding-bottom:160px">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Quay lại" onclick="go(\'lots\')">' + ICON.back + '</button>' +
    '<div class="grow"><div class="eyebrow">' + (KHO_TEN[l.kho] || 'Lô hàng') + (l.han ? ' · Hạn giao ' + esc(l.han) : '') + (done ? ' · Đã hoàn tất' : '') + '</div>' +
    '<div class="title" style="word-break:break-all">' + esc(poName(l)) + '</div></div>' +
    '<button type="button" class="iconbtn" aria-label="Tải lại" onclick="loadLot()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button></div>' +
    '<div class="split"><div class="main stack">' +
    '<div class="card stack">' + info +
    '<div class="stack" style="gap:6px"><div class="bar"><div style="width:' + pct(slDong, slCan) + '%"></div></div>' +
    '<div class="row between small muted"><span>Đã đóng ' + slDong + ' / ' + slCan + ' pcs · ' + d.bags.length + ' bao</span></div></div>' + drafts + '</div>' +
    pxk +
    '<div class="card stack"><h3 style="margin:0">Các bao đã chốt (' + d.bags.length + ')</h3><div class="tablebox"><table class="t" style="min-width:560px"><thead><tr><th>Bao</th><th>Barcode</th><th class="num">SL</th><th>Tình trạng</th><th>Người đóng</th><th>Thời gian</th>' +
    '<th>Bằng chứng</th></tr></thead><tbody>' + (bags || '<tr><td colspan="7" class="muted">Chưa có bao nào.</td></tr>') + '</tbody></table></div></div>' +
    '</div><div class="side stack"><div class="bold">Danh sách SKU (' + d.items.length + ')</div>' + items + '</div></div>' +
    '</div>' +
    (!done ? '<div class="sticky"><div class="inner"><button type="button" class="btn pri block" onclick="newBag()">+ Đóng bao mới</button></div></div>' : '') +
    nav('lots'), keep);
}

function saveLotInfo() {
  call('updateLot', { lotId: S.lotId, po: $('lpo').value, asn: $('lasn').value, kho: $('lkho').value }).then(function (d) { toast('Đã lưu.'); showLot(d); });
}
function setLotStatus(st) {
  var msg = st === 'done' ? 'Hoàn tất lô? SKU chưa đóng sẽ ghi SL thực tế = 0 vào file gốc.' : 'Mở lại lô để đóng thêm bao?';
  ask(msg).then(function (ok) {
    if (!ok) return;
    call('setLotStatus', { lotId: S.lotId, status: st }).then(function (d) { toast('Đã cập nhật.'); showLot(d); });
  });
}
function doWriteBack() {
  ask('Ghi kết quả vào file gốc? SKU chưa có bao sẽ ghi SL thực tế = 0.').then(function (ok) {
    if (!ok) return;
    call('writeBack', { lotId: S.lotId }, { text: 'Đang ghi vào file gốc…' }).then(function () { toast('Đã ghi vào file gốc.'); });
  });
}
function doExport() {
  var asn = S.detail && S.detail.lot && String(S.detail.lot.asn || '').trim();
  (asn ? Promise.resolve(true) : ask('Lô chưa có ASN (nhập ASN rồi bấm "Lưu thông tin lô"). Phiếu sẽ không có mã QR. Vẫn xuất?'))
    .then(function (ok) { if (ok) exportNow(); });
}
function exportNow() {
  call('exportPxk', { lotId: S.lotId }, { text: 'Đang tạo phiếu xuất kho…' }).then(function (r) {
    loadLot();
    if (r.warning) toast(r.warning, true);
    // Mở bằng cú bấm của người dùng để trình duyệt không chặn tab mới
    ask('Đã tạo phiếu xuất kho:\n' + r.name, { ok: 'Mở phiếu' }).then(function (open) {
      if (open) window.open(r.url, '_top');   // mở ngay trong tab này, bấm ← để quay lại
    });
  });
}
function deleteLot() {
  ask('Xóa lô ' + poName(S.detail.lot) + ' khỏi phần mềm? Các bao, video và ảnh của lô sẽ vào thùng rác Drive. File gốc KHÔNG bị thay đổi.', { ok: 'Xóa lô', danger: true }).then(function (ok) {
    if (!ok) return;
    var id = S.lotId;
    call('deleteLot', { lotId: id }, { text: 'Đang xóa lô…' }).then(function () {
      delete S.lotCache[id]; S.lots = S.lots.filter(function (l) { return l.lotId !== id; });
      toast('Đã xóa lô.'); go('lots');
    });
  });
}
function delBag(id, no) {
  ask('Xóa bao số ' + no + '? Video và ảnh của bao sẽ vào thùng rác.', { ok: 'Xóa bao', danger: true }).then(function (ok) {
    if (!ok) return;
    call('deleteBag', { bagId: id }).then(function (d) { toast('Đã xóa bao.'); showLot(d); syncLot(S.lotId); });
  });
}

/* ===================== ĐÓNG BAO ===================== */
/* Mở ngay màn hình đóng bao; số bao lấy ngầm từ máy chủ (1–2 giây) */
function newBag() {
  var lotId = S.lotId;
  var bag = { bagId: null, baoNo: null, sku: null, qty: '', q: '', video: null, videoId: null, progress: 0,
    photos: [], danTem: false, xuatTrucTiep: false, xuatSSC: false, maDonSSC: '', slGoiThem: '', tinhTrang: '' };
  bag.ready = call('startBag', { lotId: lotId }, { quiet: true, silent: true }).then(function (r) {
    bag.bagId = r.bagId; bag.baoNo = r.baoNo;
    if (S.bag === bag) [].forEach.call(document.querySelectorAll('.baono'), function (el) { el.textContent = r.baoNo; });
    return bag;
  });
  bag.ready.catch(function (e) {
    if (S.bag !== bag) return;
    S.bag = null; S.uploading = false;
    toast('Chưa tạo được bao mới: ' + ((e && e.message) || 'mất kết nối') + '. Bấm lại "Đóng bao mới".', true);
    showLot(S.lotCache[lotId] || S.detail);
  });
  S.bag = bag; S.view = 'bag'; viewBag();
}

function bagItem() {
  var b = S.bag; if (!b || !b.sku) return null;
  return S.detail.items.filter(function (i) { return i.sku === b.sku; })[0];
}

function viewBag() {
  var b = S.bag, it = bagItem();
  var no = '<span class="baono">' + (b.baoNo || '…') + '</span>';
  var q = (b.q || '').toLowerCase();
  var list = S.detail.items.filter(function (i) {
    return !q || (i.barcode + ' ' + i.sku + ' ' + i.phanLoai).toLowerCase().indexOf(q) >= 0;
  }).sort(function (x, y) { return (x.slDong >= x.slCan) - (y.slDong >= y.slCan); });
  var picks = list.map(function (i) {
    var full = i.slDong >= i.slCan;
    return '<button type="button" class="pick ' + (b.sku === i.sku ? 'on' : '') + (full ? ' dim' : '') + '" onclick="pickSku(\'' + esc(i.sku) + '\')">' +
      '<div class="bold" style="font-size:14px">' + esc(i.barcode || i.sku) + '</div>' +
      '<div class="small" style="color:var(--text2)">' + esc(i.phanLoai) + '</div>' +
      '<div class="muted small">SKU ' + esc(i.sku) + '</div>' +
      '<div class="small bold" style="margin-top:4px">Cần ' + i.slCan + ' · Đã đóng ' + i.slDong + ' · Còn ' + Math.max(0, i.slCan - i.slDong) + '</div></button>';
  }).join('');

  var vid;
  if (b.videoId) vid = '<div class="vidok">✓ Video đã lưu lên Drive<span class="grow"></span><button type="button" class="btn sm" onclick="redoVideo()">' + (CAN_RECORD ? 'Quay lại' : 'Chọn lại') + '</button></div>';
  else if (b.video) vid = '<div class="stack"><div class="row between"><span class="bold">Đang tải video lên…</span><span class="small muted">' +
    (b.video.size / 1048576).toFixed(1) + ' MB</span></div><div class="bar"><div id="vbar" style="width:' + b.progress + '%"></div></div>' +
    '<div class="small muted" id="vtxt">' + b.progress + '% · Vui lòng không tắt trang</div>' +
    (b.videoError ? '<div class="small" style="color:var(--bad)">' + esc(b.videoError) + '</div><button type="button" class="btn sm" onclick="uploadVideo()">Thử tải lại</button>' : '') + '</div>';
  else if (CAN_RECORD) vid = '<button type="button" class="drop" onclick="recordVideo()" style="color:var(--pri-ink)">' + ICON.video +
    '<div class="bold">Quay video ngay</div><div class="muted small">Bắt buộc · Quay Full HD ngay trong app, quay xong tự lưu lên Drive</div></button>' +
    '<div class="center small"><a href="#" onclick="$(\'vfile\').click();return false">hoặc chọn video đã quay sẵn</a></div>';
  else vid = '<button type="button" class="drop" onclick="$(\'vfile\').click()" style="color:var(--pri-ink)">' + ICON.up +
    '<div class="bold">Chọn video đã quay</div><div class="muted small">Bắt buộc · Quay bằng app Camera trước (1080p), rồi bấm đây chọn video</div></button>' +
    '<div class="center small"><a href="#" onclick="$(\'vcap\').click();return false">hoặc quay nhanh bằng máy quay</a>' +
    (IS_IOS ? '<div class="muted" style="margin-top:2px">Trên iPhone, quay nhanh sẽ bị mờ, chỉ dùng khi gấp</div>' : '') + '</div>';

  var thumbs = b.photos.map(function (p) {
    return '<div style="position:relative"><img src="' + p.thumb + '" alt="Ảnh bao">' + (p.id ? '' : '<div class="small muted center">đang tải…</div>') + '</div>';
  }).join('');

  var left = it ? Math.max(0, it.slCan - it.slDong) : 0;
  var moreOpen = b.danTem || b.xuatTrucTiep || b.xuatSSC || b.maDonSSC || b.slGoiThem || b.tinhTrang;
  render('<div class="wrap stack" style="max-width:640px;padding-bottom:180px">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Hủy bao" onclick="cancelBag()">' + ICON.back + '</button>' +
    '<div class="grow"><div class="eyebrow" style="word-break:break-all">' + esc(poName(S.detail.lot)) + '</div><div class="title">Bao số ' + no + '</div></div>' +
    '<span class="chip soft">Mã kiện ' + no + '</span></div>' +

    '<div class="card stack"><h3 style="margin:0"><span class="stepno">01</span>Chọn hàng &amp; số lượng</h3>' +
    (it ? '<div class="pick on"><div class="bagsku"><div class="grow"><div class="nm">' + esc(it.barcode || it.sku) + '</div>' +
      '<div class="small" style="color:var(--text2)">' + esc(it.ten) + ' · ' + esc(it.phanLoai) + '</div><div class="muted small">SKU ' + esc(it.sku) + '</div></div>' +
      '<button type="button" class="btn sm" onclick="S.bag.sku=null;viewBag()">Đổi</button></div>' +
      '<div class="need"><div>Cần<b>' + it.slCan + '</b></div><div>Đã đóng<b>' + it.slDong + '</b></div><div class="left">Còn<b>' + left + '</b></div></div></div>' +
      '<div class="qtyrow"><span class="lb">Số lượng<br>trong bao</span><div class="stepper grow">' +
      '<button type="button" class="btn" aria-label="Giảm" onclick="stepQty(-1)">−</button>' +
      '<input class="in grow" type="number" inputmode="numeric" min="1" id="bqty" aria-label="Số lượng" value="' + esc(b.qty) + '" oninput="S.bag.qty=this.value">' +
      '<button type="button" class="btn" aria-label="Tăng" onclick="stepQty(1)">+</button></div></div>'
      : '<input class="in" type="search" placeholder="Gõ barcode để tìm, ví dụ DN-P-2" value="' + esc(b.q) + '" oninput="S.bag.q=this.value;filterPicks()" id="bq">' +
        '<div class="stack" id="picks" style="gap:8px">' + picks + '</div>') + '</div>' +

    '<div class="card stack"><h3 style="margin:0"><span class="stepno">02</span>Video đóng hàng <span class="chip bad" style="margin-left:6px">Bắt buộc</span></h3>' + vid + '</div>' +

    '<div class="card stack"><h3 style="margin:0"><span class="stepno">03</span>Ảnh bao hàng</h3>' +
    '<div class="thumbs">' + thumbs + '<button type="button" class="add" aria-label="Chụp ảnh" onclick="$(\'pfile\').click()">' + ICON.cam + '</button></div></div>' +

    '<details class="more"' + (moreOpen ? ' open' : '') + '><summary><span class="stepno">04</span>Thông tin thêm <span class="muted small" style="font-weight:600;margin-left:6px">không bắt buộc</span></summary><div class="stack">' +
    '<label class="check"><input type="checkbox" ' + (b.danTem ? 'checked' : '') + ' onchange="S.bag.danTem=this.checked">Dán tem</label>' +
    '<label class="check"><input type="checkbox" ' + (b.xuatTrucTiep ? 'checked' : '') + ' onchange="S.bag.xuatTrucTiep=this.checked">Xuất hàng trực tiếp</label>' +
    '<label class="check"><input type="checkbox" ' + (b.xuatSSC ? 'checked' : '') + ' onchange="S.bag.xuatSSC=this.checked">Xuất hàng SSC</label>' +
    '<div class="grid2"><label class="f">Mã đơn xuất SSC<input class="in" value="' + esc(b.maDonSSC) + '" oninput="S.bag.maDonSSC=this.value" placeholder="Nếu có"></label>' +
    '<label class="f">SL cần gọi thêm<input class="in" type="number" inputmode="numeric" value="' + esc(b.slGoiThem) + '" oninput="S.bag.slGoiThem=this.value" placeholder="0"></label></div>' +
    '<label class="f">Tình trạng<select class="in" onchange="S.bag.tinhTrang=this.value"><option value="">Chọn…</option>' +
    S.tinhTrang.map(function (t) { return '<option' + (b.tinhTrang === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></label></div></details>' +
    '</div>' +
    '<input type="file" id="vfile" accept="video/*" hidden onchange="gotVideoFile(this)">' +
    '<input type="file" id="vcap" accept="video/*" capture="environment" hidden onchange="gotVideoFile(this)">' +
    '<input type="file" id="pfile" accept="image/*" capture="environment" hidden onchange="gotPhotos(this)">' +
    '<div class="sticky"><div class="inner"><button type="button" class="btn pri block" onclick="saveBag()">✓ Chốt bao số ' + no + '</button></div></div>' +
    nav('lots'));
}

function filterPicks() {
  var y = window.scrollY; viewBag();
  var el = $('bq'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  window.scrollTo(0, y);
}
function pickSku(sku) {
  S.bag.sku = sku;
  var it = bagItem();
  if (it && !S.bag.qty) S.bag.qty = Math.max(0, it.slCan - it.slDong) || '';
  viewBag();
}
function stepQty(n) {
  var v = Math.max(0, (Number($('bqty').value) || 0) + n);
  S.bag.qty = v; $('bqty').value = v;
}

function cancelBag() {
  if (S.uploading) return toast('Video đang tải lên, vui lòng chờ xong.', true);
  ask('Hủy bao số ' + S.bag.baoNo + '? Thông tin đã nhập sẽ mất.', { ok: 'Hủy bao', danger: true }).then(function (ok) {
    if (!ok || !S.bag) return;
    var bag = S.bag, lotId = S.lotId; S.bag = null;
    showLot(S.lotCache[lotId] || S.detail);   // quay về lô ngay, báo hủy chạy ngầm
    bag.ready.then(function () { return call('cancelBag', { bagId: bag.bagId }, { quiet: true, silent: true }); })
      .then(function (d) {
        if (!d || !d.lot) return;
        S.lotCache[d.lot.lotId] = d;
        if (S.view === 'lot' && S.lotId === d.lot.lotId && !S.bag && !editing()) { S.detail = d; viewLot(true); }
      }).catch(function () { /* bao nháp còn trên máy chủ, lần sau hiện "đang đóng dở" */ });
  });
}

function saveBag() {
  var b = S.bag;
  if (!b.bagId) return toast('Đang lấy số bao, chờ 1–2 giây rồi bấm lại nhé.', true);
  if (!b.sku) return toast('Chưa chọn SKU.', true);
  if (!(Number(b.qty) > 0)) return toast('Chưa nhập số lượng.', true);
  if (S.uploading) return toast('Video đang tải lên, chờ chút nhé.', true);
  if (!b.videoId) return toast('Bao chưa có video.', true);
  if (b.photos.some(function (p) { return !p.id; })) return toast('Ảnh đang tải lên, chờ chút nhé.', true);
  var it = bagItem();
  var over = it && it.slDong + Number(b.qty) > it.slCan;
  (over ? ask('Tổng số lượng sẽ vượt số lượng cần (' + it.slCan + '). Vẫn chốt?') : Promise.resolve(true)).then(function (ok) {
    if (ok) doSaveBag(b);
  });
}
function doSaveBag(b) {
  call('saveBag', {
    bagId: b.bagId, sku: b.sku, qty: Number(b.qty), videoId: b.videoId,
    photoIds: b.photos.map(function (p) { return p.id; }),
    danTem: b.danTem, xuatTrucTiep: b.xuatTrucTiep, xuatSSC: b.xuatSSC,
    maDonSSC: b.maDonSSC, slGoiThem: b.slGoiThem, tinhTrang: b.tinhTrang
  }, { text: 'Đang chốt bao…' }).then(function (r) {
    S.bag = null;
    toast('Đã chốt bao số ' + r.baoNo + '.');
    showLot(r.detail);
    syncLot(r.lotId);
  });
}

/* ---------- Quay video trong trình duyệt ---------- */
/* Chỉ quay được khi app chạy ở trang web riêng (Google Apps Script chặn camera trong khung của nó). */
var REC = null;
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_WEB = !!window.GODFBS_WEB;
var CAN_RECORD = IS_WEB && !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
var REC_MAX_MS = 30 * 60 * 1000;   // tự dừng sau 30 phút
function pickMime() {
  var mp4 = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4'], webm = ['video/webm;codecs=vp8,opus', 'video/webm'];
  var list = IS_IOS ? mp4.concat(webm) : webm.concat(mp4);   // iPhone quay MP4, Android quay WebM
  if (!window.MediaRecorder) return null;
  for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}
/* Giữ màn hình luôn sáng khi đang quay / đang tải video */
var WAKE = null;
function keepAwake(on) {
  if (!('wakeLock' in navigator)) return;
  if (on && !WAKE) navigator.wakeLock.request('screen').then(function (w) { WAKE = w; w.addEventListener('release', function () { if (WAKE === w) WAKE = null; }); }).catch(function () {});
  if (!on && WAKE) { WAKE.release().catch(function () {}); WAKE = null; }
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && (REC || S.uploading)) keepAwake(true); });

function camConstraints(relaxed) {
  return { facingMode: { ideal: 'environment' },
    width: { ideal: relaxed ? 1280 : 1920, max: 1920 }, height: { ideal: relaxed ? 720 : 1080, max: 1080 },
    frameRate: { ideal: 30, max: 30 } };
}
function openCamera() {
  var gum = function (v, a) { return navigator.mediaDevices.getUserMedia({ video: v, audio: a }); };
  return gum(camConstraints(false), true)
    .catch(function (e) { if (e && e.name === 'OverconstrainedError') return gum(camConstraints(true), true); throw e; })
    .catch(function (e) { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e; return gum(camConstraints(true), false); });   // micro hỏng thì quay không tiếng
}

function recordVideo() {
  var mime = pickMime();
  if (!CAN_RECORD || mime === null) {
    return ask('Trình duyệt này không quay được video ngay trong app. Hãy quay bằng app Camera rồi bấm "chọn video đã quay sẵn".', { ok: 'Chọn video' })
      .then(function (ok) { if (ok) $('vfile').click(); });
  }
  openCamera().then(function (stream) {
    try {   // lấy nét liên tục nếu máy hỗ trợ
      var track = stream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
    } catch (e) { /* bỏ qua */ }
    openRecorder(stream, mime);
  }).catch(function (e) {
    var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    ask((denied
      ? 'Trình duyệt đang CHẶN camera.\niPhone: Cài đặt → Safari → Camera → Cho phép (và Micrô → Cho phép), rồi tải lại trang.\nAndroid: bấm biểu tượng cạnh địa chỉ trang → Quyền → Camera, Micrô → Cho phép.'
      : 'Không mở được camera (' + ((e && e.name) || 'lỗi') + ').') +
      '\n\nTạm thời có thể quay bằng app Camera rồi chọn video đã quay.', { ok: 'Chọn video' })
      .then(function (ok) { if (ok) $('vfile').click(); });
  });
}

function resText(stream) {
  var st = {}; try { st = stream.getVideoTracks()[0].getSettings() || {}; } catch (e) {}
  var w = st.width || 0, h = st.height || 0, short = Math.min(w, h);
  if (!w || !h) return '';
  return w + '×' + h + ' · ' + (short >= 1080 ? 'Full HD' : short >= 720 ? 'HD' : 'chất lượng thấp');
}
function openRecorder(stream, mime) {
  var div = document.createElement('div');
  div.className = 'rec'; div.id = 'rec';
  div.innerHTML = '<div class="rectop"><span id="recres">' + esc(resText(stream)) + '</span><span id="recdot2" class="recon" hidden>● Đang quay</span></div>' +
    '<video id="recv" playsinline muted autoplay></video>' +
    '<div class="ctl"><button type="button" class="btn sm" onclick="cancelRec()">Hủy</button>' +
    '<button type="button" class="recdot" id="recbtn" aria-label="Bắt đầu quay" onclick="toggleRec()"></button>' +
    '<div id="rect" style="min-width:64px;text-align:right;font-weight:700">00:00</div></div>';
  document.body.appendChild(div);
  $('recv').srcObject = stream;
  REC = { stream: stream, mime: mime, chunks: [], rec: null, t0: 0, timer: null };
  keepAwake(true);
}
function cancelRec() {
  if (REC && REC.rec) return ask('Bỏ đoạn video đang quay?', { ok: 'Bỏ video', danger: true }).then(function (ok) { if (ok) { closeRecorder(true); keepAwake(false); } });
  closeRecorder(true); keepAwake(false);
}

function toggleRec() {
  if (!REC) return;
  if (!REC.rec) {
    var st = {}; try { st = REC.stream.getVideoTracks()[0].getSettings() || {}; } catch (e) {}
    var px = (st.width || 1920) * (st.height || 1080);
    var opts = { videoBitsPerSecond: px >= 1920 * 1080 ? 6000000 : 4000000, audioBitsPerSecond: 96000 };   // ~45 MB mỗi phút ở Full HD
    if (REC.mime) opts.mimeType = REC.mime;
    try { REC.rec = new MediaRecorder(REC.stream, opts); } catch (e) { REC.rec = new MediaRecorder(REC.stream); }
    REC.rec.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
    REC.rec.onstop = function () {
      var type = (REC.rec.mimeType || REC.mime || 'video/webm').split(';')[0];
      var blob = new Blob(REC.chunks, { type: type });
      closeRecorder(false);
      setVideo(blob);
    };
    REC.rec.start(1000);
    REC.t0 = Date.now();
    $('recbtn').classList.add('stop'); $('recbtn').setAttribute('aria-label', 'Dừng quay');
    $('recdot2').hidden = false;
    REC.timer = setInterval(function () {
      var ms = Date.now() - REC.t0, s = Math.floor(ms / 1000);
      $('rect').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      if (ms >= REC_MAX_MS && REC.rec.state === 'recording') { toast('Đã quay đủ 30 phút, tự dừng.'); REC.rec.stop(); }
    }, 500);
  } else if (REC.rec.state === 'recording') {
    REC.rec.stop();
  }
}

function closeRecorder(cancel) {
  if (!REC) return;
  clearInterval(REC.timer);
  REC.stream.getTracks().forEach(function (t) { t.stop(); });
  if (cancel && REC.rec && REC.rec.state !== 'inactive') { REC.rec.onstop = null; REC.rec.stop(); }
  var el = $('rec'); if (el) el.remove();
  if (cancel) REC = null;
}

function gotVideoFile(input) {
  var f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  if (f.size <= 600 * 1048576) return setVideo(f);
  ask('Video khá nặng (' + (f.size / 1048576).toFixed(0) + ' MB), tải lên sẽ lâu. Tiếp tục?').then(function (ok) { if (ok) setVideo(f); });
}

function setVideo(blob) {
  REC = null;
  S.bag.video = blob; S.bag.videoId = null; S.bag.progress = 0; S.bag.videoError = '';
  viewBag(); uploadVideo();
}
function redoVideo() {
  ask('Chọn video khác? Video cũ vẫn nằm trong thư mục của bao.').then(function (ok) {
    if (!ok || !S.bag) return;
    S.bag.video = null; S.bag.videoId = null; viewBag();
  });
}

function setProgress(p) {
  S.bag.progress = p;
  var bar = $('vbar'), txt = $('vtxt');
  if (bar) bar.style.width = p + '%';
  if (txt) txt.textContent = p + '% · Vui lòng không tắt trang';
}

function uploadVideo() {
  var bag = S.bag, blob = bag.video;
  var mime = (blob.type || 'video/mp4').split(';')[0];
  S.uploading = true; bag.videoError = ''; keepAwake(true);
  bag.ready.then(function () { return call('startVideoUpload', { bagId: bag.bagId, mimeType: mime, size: blob.size, origin: location.origin }, { quiet: true }); })
    .then(function (r) { return sendChunks(r.uploadUrl, blob, mime); })
    .then(function (fileId) {
      S.uploading = false; keepAwake(false);
      if (S.bag !== bag) return;
      bag.videoId = fileId; bag.video = null; viewBag(); toast('Video đã lưu lên Drive.');
    })
    .catch(function (e) {
      S.uploading = false; keepAwake(false);
      if (S.bag !== bag) return;
      bag.videoError = 'Tải video lỗi: ' + ((e && e.message) || 'mất kết nối') + '. Bấm thử lại.';
      viewBag();
    });
}

var CHUNK = 8 * 262144;          // 2 MB, bội số 256 KB
async function sendChunks(url, blob, mime) {
  var total = blob.size, start = 0, direct = true;
  while (start < total) {
    var end = Math.min(start + CHUNK, total);
    var part = blob.slice(start, end);
    var res = null;
    if (direct) {
      try {
        var r = await fetch(url, { method: 'PUT', headers: { 'Content-Range': 'bytes ' + start + '-' + (end - 1) + '/' + total }, body: part });
        if (r.status === 200 || r.status === 201) { var j = await r.json(); setProgress(100); return j.id; }
        if (r.status !== 308) throw new Error('Mã lỗi ' + r.status);
        res = { done: false };
      } catch (e) {
        if (start !== 0) throw e;
        // trình duyệt chặn tải thẳng → chuyển sang gửi qua máy chủ, hỏi Drive đã nhận tới đâu
        direct = false;
        var st = await call('uploadChunk', { uploadUrl: url, total: total, query: true }, { quiet: true, silent: true });
        if (st.done) { setProgress(100); return st.fileId; }
        start = st.next || 0;
        continue;
      }
    }
    if (!direct) {
      var b64 = await blobToB64(part);
      res = await call('uploadChunk', { uploadUrl: url, start: start, total: total, b64: b64 }, { quiet: true, silent: true });
      if (res.done) { setProgress(100); return res.fileId; }
    }
    start = end;
    setProgress(pct(start, total));
  }
  throw new Error('Không nhận được xác nhận từ Drive');
}

function blobToB64(blob) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

/* ---------- Chụp ảnh ---------- */
function gotPhotos(input) {
  var files = Array.prototype.slice.call(input.files || []); input.value = '';
  files.forEach(function (f) {
    compressImage(f, 1280, 0.75).then(function (dataUrl) {
      var bag = S.bag;
      var p = { thumb: dataUrl, id: null };
      bag.photos.push(p); viewBag();
      return bag.ready.then(function () { return call('uploadPhoto', { bagId: bag.bagId, dataUrl: dataUrl }, { quiet: true }); }).then(function (r) {
        p.id = r.fileId; if (S.bag === bag) viewBag();
      }).catch(function () {
        bag.photos.splice(bag.photos.indexOf(p), 1); if (S.bag === bag) viewBag();
      });
    });
  });
}

function compressImage(file, max, q) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ===================== TÀI KHOẢN ===================== */
function loadUsers() {
  call('listUsers', {}, { text: 'Đang tải tài khoản…' }).then(function (u) { S.users = u; viewUsers(); });
}
function viewUsers() {
  var rows = S.users.map(function (u) {
    return '<div class="card row between wrapflex"><div class="grow"><div class="bold">' + esc(u.hoTen) + '</div>' +
      '<div class="muted small">' + esc(u.username) + ' · ' + (u.role === 'admin' ? 'Quản trị' : 'Nhân viên') + '</div></div>' +
      (u.active ? '<span class="chip ok">Đang dùng</span>' : '<span class="chip bad">Đã khóa</span>') +
      (u.username !== S.user.username ?
        '<div class="row"><button type="button" class="btn sm" onclick="resetPw(\'' + esc(u.username) + '\')">Đổi mật khẩu</button>' +
        '<button type="button" class="btn sm ' + (u.active ? 'danger' : '') + '" onclick="toggleUser(\'' + esc(u.username) + '\',' + !u.active + ')">' + (u.active ? 'Khóa' : 'Mở khóa') + '</button></div>' : '') +
      '</div>';
  }).join('');
  render('<div class="wrap stack" style="max-width:640px"><div class="title">Tài khoản</div>' + rows +
    '<form class="card stack" onsubmit="addUser(event)"><h3 style="margin:0">Thêm tài khoản</h3>' +
    '<label class="f">Họ tên<input class="in" id="nh" required></label>' +
    '<div class="grid2"><label class="f">Tên đăng nhập<input class="in" id="nu" autocapitalize="none" required></label>' +
    '<label class="f">Mật khẩu<input class="in" id="np" type="text" autocomplete="off" required></label></div>' +
    '<label class="f">Quyền<select class="in" id="nr"><option value="staff">Nhân viên (chỉ nhập liệu)</option><option value="admin">Quản trị</option></select></label>' +
    '<button type="submit" class="btn pri">Tạo tài khoản</button></form></div>' + nav('users'));
}
function addUser(e) {
  e.preventDefault();
  call('createUser', { hoTen: $('nh').value, username: $('nu').value, password: $('np').value, role: $('nr').value })
    .then(function () { toast('Đã tạo tài khoản.'); loadUsers(); });
}
function toggleUser(u, active) {
  call('setUserActive', { username: u, active: active }).then(function () { loadUsers(); });
}
function resetPw(u) {
  ask('Mật khẩu mới cho ' + u + ' (ít nhất 6 ký tự):', { input: true, ok: 'Đổi mật khẩu' }).then(function (p) {
    if (!p) return;
    call('resetPassword', { username: u, password: p }).then(function () { toast('Đã đổi mật khẩu.'); });
  });
}

boot();
