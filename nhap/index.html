/* ---------- Quay video trong trình duyệt ---------- */
/* Chỉ quay được khi app chạy ở trang web riêng (Google Apps Script chặn camera trong khung của nó). */
var REC = null;
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_WEB = !!window.GODFBS_WEB;
var CAN_RECORD = IS_WEB && !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
var REC_MAX_MS = 30 * 60 * 1000;   // tự dừng sau 30 phút
function pickMime() {
  var mp4 = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4'], webm = ['video/webm;codecs=vp8,opus', 'video/webm'];
  var list = IS_IOS ? mp4.concat(webm) : webm.concat(mp4);   // iPhone quay MP4, Android quay WebM
  if (!window.MediaRecorder) return null;
  for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}
/* Giữ màn hình luôn sáng khi đang quay / đang tải video */
var WAKE = null;
function keepAwake(on) {
  if (!('wakeLock' in navigator)) return;
  if (on && !WAKE) navigator.wakeLock.request('screen').then(function (w) { WAKE = w; w.addEventListener('release', function () { if (WAKE === w) WAKE = null; }); }).catch(function () {});
  if (!on && WAKE) { WAKE.release().catch(function () {}); WAKE = null; }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) recCut('ẩn app');   // có cuộc gọi / chuyển app khi đang quay
  else { if (REC || vqBusy()) keepAwake(true); vqKick(); }
});
window.addEventListener('pagehide', function () { recCut('tắt trang'); });
window.addEventListener('online', function () { vqKick(); });

function camConstraints(relaxed) {
  return { facingMode: { ideal: 'environment' },
    width: { ideal: relaxed ? 1280 : 1920, max: 1920 }, height: { ideal: relaxed ? 720 : 1080, max: 1080 },
    frameRate: { ideal: 30, max: 30 } };
}
function openCamera() {
  var gum = function (v, a) { return navigator.mediaDevices.getUserMedia({ video: v, audio: a }); };
  return gum(camConstraints(false), true)
    .catch(function (e) { if (e && e.name === 'OverconstrainedError') return gum(camConstraints(true), true); throw e; })
    .catch(function (e) { if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e; return gum(camConstraints(true), false); });   // micro hỏng thì quay không tiếng
}

function recordVideo() {
  var mime = pickMime();
  if (!CAN_RECORD || mime === null) {
    return ask('Trình duyệt này không quay được video ngay trong app. Hãy quay bằng app Camera rồi bấm "chọn video đã quay sẵn".', { ok: 'Chọn video' })
      .then(function (ok) { if (ok) $('vfile').click(); });
  }
  vqSpaceOk().then(function (ok) {
    if (!ok) return;
    openCamera().then(function (stream) {
      try {   // lấy nét liên tục nếu máy hỗ trợ
        var track = stream.getVideoTracks()[0], caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
      } catch (e) { /* bỏ qua */ }
      openRecorder(stream, mime);
    }).catch(function (e) {
      var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      ask((denied
        ? 'Trình duyệt đang CHẶN camera.\niPhone: Cài đặt → Safari → Camera → Cho phép (và Micrô → Cho phép), rồi tải lại trang.\nAndroid: bấm biểu tượng cạnh địa chỉ trang → Quyền → Camera, Micrô → Cho phép.'
        : 'Không mở được camera (' + ((e && e.name) || 'lỗi') + ').') +
        '\n\nTạm thời có thể quay bằng app Camera rồi chọn video đã quay.', { ok: 'Chọn video' })
        .then(function (ok) { if (ok) $('vfile').click(); });
    });
  });
}

function resText(stream) {
  var st = {}; try { st = stream.getVideoTracks()[0].getSettings() || {}; } catch (e) {}
  var w = st.width || 0, h = st.height || 0, short = Math.min(w, h);
  if (!w || !h) return '';
  return w + '×' + h + ' · ' + (short >= 1080 ? 'Full HD' : short >= 720 ? 'HD' : 'chất lượng thấp');
}
function openRecorder(stream, mime) {
  var div = document.createElement('div');
  div.className = 'rec'; div.id = 'rec';
  div.innerHTML = '<div class="rectop"><span id="recres">' + esc(resText(stream)) + '</span><span id="recup"></span><span id="recdot2" class="recon" hidden>● Đang quay</span></div>' +
    '<video id="recv" playsinline muted autoplay></video>' +
    '<div class="ctl"><button type="button" class="btn sm" onclick="cancelRec()">Hủy</button>' +
    '<div class="center"><button type="button" class="recdot" id="recbtn" aria-label="Bắt đầu quay" onclick="toggleRec()"></button>' +
    '<div class="small" id="reclb" style="margin-top:4px">Bấm để quay</div></div>' +
    '<div id="rect" style="min-width:64px;text-align:right;font-weight:700">00:00</div></div>';
  document.body.appendChild(div);
  $('recv').srcObject = stream;
  REC = { stream: stream, mime: mime, rec: null, t0: 0, timer: null, job: null, cut: false };
  stream.getTracks().forEach(function (t) { t.addEventListener('ended', function () { recCut('camera bị ngắt'); }); });
  keepAwake(true);
}
function cancelRec() {
  if (REC && REC.rec) return ask('Bỏ đoạn video đang quay? Phần đã quay sẽ bị xóa, không lưu lên Drive.', { ok: 'Bỏ video', danger: true }).then(function (ok) { if (ok) { closeRecorder(true); keepAwake(false); } });
  closeRecorder(true); keepAwake(false);
}

/* Tốc độ ghi: giữ Full HD, ghi gọn lại (~19–23 MB mỗi phút thay vì ~45 MB) — chị Bồng duyệt 20/11 */
function recBitrate(stream, mime) {
  var st = {}; try { st = stream.getVideoTracks()[0].getSettings() || {}; } catch (e) {}
  var full = Math.min(st.width || 1920, st.height || 1080) >= 1080;
  var mp4 = /mp4/.test(mime || '');   // iPhone (MP4) nén tốt hơn Android (WebM) nên cần ít hơn
  return full ? (mp4 ? 2500000 : 3000000) : (mp4 ? 1800000 : 2000000);
}

function toggleRec() {
  if (!REC) return;
  if (!REC.rec) {
    var opts = { videoBitsPerSecond: recBitrate(REC.stream, REC.mime), audioBitsPerSecond: 64000 };
    if (REC.mime) opts.mimeType = REC.mime;
    try { REC.rec = new MediaRecorder(REC.stream, opts); } catch (e) { REC.rec = new MediaRecorder(REC.stream); }
    var r = REC, bag = S.bag;
    r.rec.ondataavailable = function (e) { if (e.data && e.data.size && r.job) vqAdd(r.job, e.data); };
    r.rec.onerror = function () { recCut('lỗi máy quay'); };
    r.rec.onstop = function () { recStopped(r, bag); };
    r.rec.start(2000);   // cứ 2 giây lưu 1 đoạn vào máy và đẩy dần lên Drive
    r.job = vqNew(bag, (r.rec.mimeType || r.mime || 'video/webm').split(';')[0], false);
    if (bag) bag.job = r.job;
    r.t0 = Date.now();
    $('recbtn').classList.add('stop'); $('recbtn').setAttribute('aria-label', 'Dừng và lưu');
    $('reclb').textContent = 'Dừng & lưu';
    $('recdot2').hidden = false;
    r.timer = setInterval(function () {
      var ms = Date.now() - r.t0, s = Math.floor(ms / 1000);
      $('rect').textContent = mmss(s);
      var j = r.job; if (j) j.dur = s; if (j && $('recup')) $('recup').textContent = 'Đã lên Drive ' + mb(j.sent) + '/' + mb(j.size) + ' MB';
      if (ms >= REC_MAX_MS && r.rec.state === 'recording') { toast('Đã quay đủ 30 phút, tự dừng.'); r.rec.stop(); }
    }, 500);
  } else if (REC.rec.state === 'recording') {
    REC.rec.stop();
  }
}
function mmss(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function mb(n) { return (n / 1048576).toFixed(1); }

/* Đang quay mà bị ngắt (cuộc gọi, chuyển app, camera bị lấy): dừng, GIỮ phần đã quay, hỏi giữ hay quay lại */
function recCut(why) {
  if (!REC || !REC.rec || REC.rec.state !== 'recording') return;
  REC.cut = why || true;
  try { REC.rec.stop(); } catch (e) { /* bỏ qua */ }
}
function recStopped(r, bag) {
  var job = r.job;
  if (!job || job.dead) return;
  job.dur = Math.round((Date.now() - r.t0) / 1000);
  job.final = true;
  if (r.cut) job.status = 'hold'; else { job.keep = true; job.status = 'up'; }
  vqSave(job);
  closeRecorder(false);
  if (REC === r) REC = null;
  if (S.bag === bag && S.view === 'bag') viewBag();
  if (r.cut) toast('Quay bị gián đoạn. Phần đã quay vẫn còn, chọn Giữ hoặc Quay lại.', true);
  vqKick();
}

function closeRecorder(cancel) {
  if (!REC) return;
  var r = REC;
  clearInterval(r.timer);
  if (cancel && r.rec && r.rec.state !== 'inactive') { r.rec.onstop = null; r.rec.ondataavailable = null; try { r.rec.stop(); } catch (e) {} }
  r.stream.getTracks().forEach(function (t) { t.stop(); });
  var el = $('rec'); if (el) el.remove();
  if (cancel) {
    if (r.job) { if (S.bag && S.bag.job === r.job) S.bag.job = null; vqDrop(r.job); }
    REC = null;
  }
}

function gotVideoFile(input) {
  var f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  (f.size <= 600 * 1048576 ? Promise.resolve(true) : ask('Video khá nặng (' + (f.size / 1048576).toFixed(0) + ' MB), tải lên sẽ lâu. Tiếp tục?'))
    .then(function (ok) {
      if (!ok || !S.bag) return;
      if (S.bag.job) { vqDrop(S.bag.job); S.bag.job = null; }
      var job = vqNew(S.bag, (f.type || 'video/mp4').split(';')[0], true);   // video chọn từ máy: không chép vào bộ nhớ tạm (đã có trong thư viện ảnh)
      job.parts.push(f); job.size = f.size; job.final = true; job.keep = true; job.status = 'up';
      vqSave(job);
      S.bag.job = job; S.bag.videoId = null;
      viewBag(); vqKick();
    });
}

/* Quay lại / chọn lại video của bao đang đóng */
function redoVideo() {
  var b = S.bag; if (!b) return;
  ask('Quay lại video khác? Video cũ sẽ bị bỏ (tự vào thùng rác Drive khi chốt bao).', { ok: 'Quay lại' }).then(function (ok) {
    if (!ok || S.bag !== b) return;
    if (b.job) { vqDrop(b.job); b.job = null; }
    b.videoId = null; viewBag();
    if (CAN_RECORD) recordVideo();
  });
}
function keepCutVideo() {
  var j = S.bag && S.bag.job; if (!j) return;
  j.keep = true; j.status = 'up'; vqSave(j); viewBag(); vqKick();
}
function redoCutVideo() {
  var b = S.bag; if (!b || !b.job) return;
  vqDrop(b.job); b.job = null; viewBag();
  if (CAN_RECORD) recordVideo(); else $('vfile').click();
}

/* ===================== HÀNG ĐỢI TẢI VIDEO =====================
   - Vừa quay vừa tải: mỗi 2 giây có 1 đoạn mới, đủ ~1 MB là đẩy lên Drive (phiên tải chưa biết tổng dung lượng).
   - Lưu tạm từng đoạn trong máy (IndexedDB): tắt app / sập nguồn / cuộc gọi vẫn còn video, mở lại tải tiếp.
   - Tải ngầm, lần lượt từng video: nhân viên chốt bao rồi làm bao khác luôn; video xong tự gắn vào bao. */
var VQ = { db: null, dbP: null, jobs: [], running: false, warnedDisk: false };
var VQ_Q = 262144, VQ_MIN = 4 * VQ_Q, VQ_MAX = 32 * VQ_Q, VQ_RELAY = 8 * VQ_Q;   // 256 KB · 1 MB · 8 MB · 2 MB

function vqOpen() {
  if (VQ.dbP) return VQ.dbP;
  VQ.dbP = new Promise(function (resolve) {
    try {
      var rq = indexedDB.open('gmhub-video', 1);
      rq.onupgradeneeded = function () {
        var db = rq.result;
        if (!db.objectStoreNames.contains('jobs')) db.createObjectStore('jobs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('parts')) db.createObjectStore('parts', { keyPath: ['job', 'seq'] });
      };
      rq.onsuccess = function () { VQ.db = rq.result; resolve(VQ.db); };
      rq.onerror = function () { resolve(null); };
      rq.onblocked = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
  return VQ.dbP;
}
function vqTx(store, mode, fn) {
  return vqOpen().then(function (db) {
    if (!db) return null;
    return new Promise(function (resolve) {
      try {
        var tx = db.transaction(store, mode), out = fn(tx.objectStore(store));
        tx.oncomplete = function () { resolve(out && 'result' in out ? out.result : true); };
        tx.onerror = tx.onabort = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
  });
}
var VQ_FIELDS = ['id', 'bagId', 'lotId', 'baoNo', 'user', 'mime', 'url', 'sent', 'size', 'nParts', 'final', 'keep', 'status',
  'fileId', 'saved', 'mem', 'relay', 'dur', 'createdAt'];
function vqSave(job) {
  if (job.dead) return Promise.resolve();
  var rec = {}; VQ_FIELDS.forEach(function (k) { rec[k] = job[k]; });
  return vqTx('jobs', 'readwrite', function (st) { st.put(rec); });
}
function vqNew(bag, mime, mem) {
  var job = { id: 'V' + Date.now() + Math.random().toString(36).slice(2, 6), bagId: bag && bag.bagId, lotId: S.lotId,
    baoNo: bag && bag.baoNo, user: S.user && S.user.username, mime: mime || 'video/mp4', url: '', sent: 0, size: 0, nParts: 0,
    final: false, keep: false, status: 'rec', fileId: '', saved: false, mem: !!mem, relay: false, dur: 0, createdAt: Date.now(),
    parts: [], err: '', fails: 0, directFails: 0 };
  VQ.jobs.push(job);
  if (bag && !bag.bagId && bag.ready) bag.ready.then(function () { job.bagId = bag.bagId; job.baoNo = bag.baoNo; vqSave(job); vqKick(); });
  vqSave(job); vqBar();
  return job;
}
function vqAdd(job, blob) {
  if (job.dead) return;
  var seq = job.nParts++;
  job.parts.push(blob); job.size += blob.size;
  if (!job.mem) {
    vqTx('parts', 'readwrite', function (st) { st.put({ job: job.id, seq: seq, blob: blob }); }).then(function (ok) {
      if (ok === null && !VQ.warnedDisk) { VQ.warnedDisk = true; toast('Máy không lưu tạm được video (bộ nhớ đầy?). Video vẫn tải, nhưng đừng tắt app khi chưa tải xong.', true); }
    });
  }
  vqSave(job); vqKick();
}
function vqDrop(job) {
  job.dead = true;
  VQ.jobs = VQ.jobs.filter(function (j) { return j !== job; });
  job.parts = [];
  vqTx('jobs', 'readwrite', function (st) { st.delete(job.id); });
  vqTx('parts', 'readwrite', function (st) { st.delete(IDBKeyRange.bound([job.id, 0], [job.id, Infinity])); });
  vqBar();
}
function vqBusy() { return VQ.jobs.some(function (j) { return !j.dead && j.keep && (!j.fileId || j.saved); }); }
function vqKick() { if (!VQ.running) vqLoop(); vqBar(); }
function vqSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* Việc tiếp theo cần làm của 1 video (null = chưa có gì để làm) */
function vqWork(j) {
  if (j.dead || !S.token) return null;
  if (j.fileId) return j.saved ? 'link' : null;
  if (!j.bagId) return null;
  if (j.status === 'rec' && !REC) return null;   // đoạn quay dở sau khi mở lại app: chờ hỏi giữ / bỏ
  if (!j.url) return j.keep || j.size >= VQ_MIN ? 'session' : null;
  if (j.final && j.keep) return 'send';
  return j.size - j.sent >= VQ_MIN ? 'send' : null;
}
async function vqLoop() {
  if (VQ.running) return;
  VQ.running = true;
  try {
    while (true) {
      var todo = VQ.jobs.slice().sort(function (a, b) { return a.createdAt - b.createdAt; }).filter(vqWork);
      if (!todo.length) break;
      if (navigator.onLine === false) { todo[0].err = 'Điện thoại đang mất mạng'; vqShow(todo[0]); break; }   // có mạng lại sẽ tự chạy tiếp
      // lần lượt từng video (cũ trước); video đang lỗi thì tạm nhường video khác, chờ rồi thử lại
      var now = Date.now(), job = todo.filter(function (j) { return !(j.nextAt > now); })[0];
      if (!job) { await vqSleep(Math.max(200, Math.min.apply(null, todo.map(function (j) { return j.nextAt; })) - now)); continue; }
      try {
        await vqStep(job, vqWork(job));
        job.fails = 0; job.err = ''; job.nextAt = 0;
      } catch (e) {
        job.fails++; job.err = (e && e.message) || 'mất kết nối';
        job.nextAt = Date.now() + Math.min(30000, 2000 * job.fails);
      }
      vqShow(job);
    }
  } finally {
    VQ.running = false; vqBar();
    if (!REC && !vqBusy()) keepAwake(false);
  }
}
async function vqStep(job, what) {
  if (what === 'link') {
    var r = await call('setBagVideo', { bagId: job.bagId, videoId: job.fileId }, { quiet: true, silent: true });
    if (!job.dead) { vqDrop(job); if (r && r.ok && S.view === 'lot' && S.lotId === job.lotId && !editing()) loadLot(); }
    return;
  }
  if (what === 'session') {
    var s = await call('startVideoUpload', { bagId: job.bagId, mimeType: job.mime, size: job.final && job.keep ? job.size : 0, origin: location.origin }, { quiet: true, silent: true });
    if (job.dead) return;
    job.url = s.uploadUrl; job.sent = 0; vqSave(job); keepAwake(true);
    return;
  }
  // gửi 1 đoạn
  var fin = job.final && job.keep, total = fin ? job.size : '*';
  var max = job.relay ? VQ_RELAY : VQ_MAX, n = Math.min(job.size - job.sent, max);
  if (!fin || job.sent + n < job.size) n = Math.floor(n / VQ_Q) * VQ_Q;   // đoạn giữa phải là bội số 256 KB
  var last = fin && job.sent + n === job.size;
  var body = new Blob(job.parts, { type: job.mime }).slice(job.sent, job.sent + n);
  var range = n ? 'bytes ' + job.sent + '-' + (job.sent + n - 1) + '/' + total : 'bytes */' + total;
  var res;
  if (!job.relay) {
    var resp;
    try { resp = await fetch(job.url, { method: 'PUT', headers: { 'Content-Range': range }, body: body }); }
    catch (e) {
      var netOk = await vqResync(job, total);
      // máy chủ vẫn gọi được mà tải thẳng lên Drive lỗi ngay đoạn đầu → trình duyệt chặn tải thẳng, chuyển sang gửi qua máy chủ
      if (netOk && job.sent === 0 && !job.fileId && ++job.directFails >= 2) { job.relay = true; vqSave(job); return; }
      throw new Error('Mất kết nối');
    }
    if (resp.status === 200 || resp.status === 201) res = { done: true, fileId: (await resp.json()).id };
    else if (resp.status === 308) res = { done: false };
    else if (resp.status === 404 || resp.status === 410) { job.url = ''; job.sent = 0; vqSave(job); throw new Error('Phiên tải hết hạn, tải lại từ đầu'); }
    else { await vqResync(job, total); throw new Error('Drive báo lỗi ' + resp.status); }
  } else {
    res = n ? await call('uploadChunk', { uploadUrl: job.url, start: job.sent, total: total, b64: await blobToB64(body) }, { quiet: true, silent: true })
            : await call('uploadChunk', { uploadUrl: job.url, total: total, query: true }, { quiet: true, silent: true });
  }
  if (job.dead) return;
  if (res.done) return vqDone(job, res.fileId);
  if (last) { await vqResync(job, total); if (!job.fileId) throw new Error('Drive chưa nhận đủ video'); return; }   // hỏi lại đã nhận tới đâu
  job.sent += n; vqSave(job);
}
/* Hỏi Drive đã nhận được tới byte nào (qua máy chủ, vì trình duyệt không đọc được) */
async function vqResync(job, total) {
  try {
    var st = await call('uploadChunk', { uploadUrl: job.url, total: total, query: true }, { quiet: true, silent: true });
    if (job.dead) return;
    if (st.done) { vqDone(job, st.fileId); return true; }
    job.sent = Math.min(st.next || 0, job.size); vqSave(job);
    return true;
  } catch (e) { return false; }   // mất mạng: lần sau hỏi lại
}
function vqDone(job, fileId) {
  job.fileId = fileId; job.status = 'done'; job.parts = [];
  vqSave(job);
  vqTx('parts', 'readwrite', function (st) { st.delete(IDBKeyRange.bound([job.id, 0], [job.id, Infinity])); });
  var b = S.bag;
  if (b && b.job === job) {   // bao đang mở trên màn hình: gắn video ngay
    b.videoId = fileId; b.job = null;
    if (S.view === 'bag' && !editing()) viewBag(); else vqShow(job);
  }
  // bao chưa chốt: giữ bản ghi (có mã file) tới khi chốt bao, lỡ tắt app thì mở lại bao vẫn gắn được video
  toast('Video bao ' + (job.baoNo || '') + ' đã lưu lên Drive.');
}

/* Khi mở bao (số bao từ máy chủ): gắn video quay dở / đang tải của chính bao này trên máy */
function vqAttach(bag) {
  var j = VQ.jobs.filter(function (x) { return !x.dead && x.bagId === bag.bagId && !x.saved; })[0];
  if (!j) return;
  if (j.fileId) { bag.videoId = j.fileId; vqDrop(j); }
  else { if (j.status === 'rec') { j.status = 'hold'; j.final = true; vqSave(j); } bag.job = j; }
  if (S.bag === bag && S.view === 'bag') viewBag();
}

/* Mở app: nạp các video còn dở trên máy, tải tiếp */
function vqInit() {
  if (VQ.inited || !S.user) return;
  VQ.inited = true;
  vqTx('jobs', 'readonly', function (st) { return st.getAll(); }).then(function (list) {
    list = list || [];
    var old = Date.now() - 7 * 864e5;
    list.forEach(function (rec) {
      if (VQ.jobs.some(function (j) { return j.id === rec.id; })) return;
      var job = Object.assign({ parts: [], err: '', fails: 0, directFails: 0 }, rec);
      if (job.createdAt < old || (job.mem && !job.fileId) || (job.user && S.user && job.user !== S.user.username && !job.saved)) {
        VQ.jobs.push(job); vqDrop(job); return;   // quá 7 ngày / video chọn từ máy mà chưa tải xong (chọn lại) / của người khác
      }
      if (job.status === 'rec') { job.status = 'hold'; job.final = true; }   // app tắt khi đang quay
      VQ.jobs.push(job);
      if (job.fileId) return;
      vqTx('parts', 'readonly', function (st) { return st.getAll(IDBKeyRange.bound([job.id, 0], [job.id, Infinity])); }).then(function (parts) {
        parts = (parts || []).sort(function (a, b) { return a.seq - b.seq; });
        job.parts = parts.map(function (p) { return p.blob; });
        job.size = job.parts.reduce(function (s, b) { return s + b.size; }, 0);
        job.nParts = parts.length ? parts[parts.length - 1].seq + 1 : 0;
        if (job.sent > job.size) job.sent = 0;
        if (!job.size) { vqDrop(job); return; }
        vqSave(job); vqKick();
      });
    });
    vqBar();
  });
}

/* Kiểm tra máy còn chỗ lưu tạm video (cần ~300 MB) */
function vqSpaceOk() {
  if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(true);
  try { if (navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* bỏ qua */ }
  return navigator.storage.estimate().then(function (e) {
    var free = (e.quota || 0) - (e.usage || 0);
    if (!e.quota || free > 300 * 1048576) return true;
    return ask('Máy gần hết chỗ lưu tạm video (còn ' + Math.round(free / 1048576) + ' MB). Nên chờ các video đang tải xong, hoặc dọn bớt bộ nhớ máy. Vẫn quay?', { ok: 'Vẫn quay' });
  }).catch(function () { return true; });
}

/* Dòng nhỏ trên cùng: còn bao nhiêu video đang tải */
function vqBar() {
  var act = VQ.jobs.filter(function (j) { return !j.dead && j.keep && !j.fileId; });
  var el = $('vqbar');
  if (!act.length) { if (el) el.hidden = true; return; }
  if (!el) { el = document.createElement('div'); el.id = 'vqbar'; el.className = 'vqbar'; el.onclick = function () { vqKick(); }; document.body.appendChild(el); }
  var j = act.sort(function (a, b) { return a.createdAt - b.createdAt; })[0];
  var bad = act.some(function (x) { return x.err; });
  el.className = 'vqbar' + (bad ? ' bad' : '');
  el.textContent = (bad ? '⚠️ ' : '⏳ ') + 'Đang tải ' + act.length + ' video · Bao ' + (j.baoNo || '…') + ' ' + pct(j.sent, j.size) + '%' +
    (bad ? ' · ' + (act.filter(function (x) { return x.err; })[0].err) + ', sẽ tự thử lại' : '');
  el.hidden = false;
}
function vqText(j) {
  if (j.err) return '⚠️ ' + esc(j.err) + ' · Video vẫn lưu trong máy, tự tải tiếp khi có mạng.';
  return 'Đang tải lên Drive ' + pct(j.sent, j.size) + '% · Có thể chốt bao luôn, video tự tải tiếp.';
}
function vqShow(job) {
  vqBar();
  if (!S.bag || S.bag.job !== job) return;
  var bar = $('vbar'), txt = $('vtxt');
  if (bar) bar.style.width = pct(job.sent, job.size) + '%';
  if (txt) txt.innerHTML = vqText(job);
}
/* Ô video của bao (bước 02) */
function vidBox(b) {
  var j = b.job;
  if (b.mode === 'edit' && b.videoId && b.videoId === b.origVid) {
    if (b.videoId === 'pending') return '<div class="vidok">⏳ Video của bao đang được tải lên từ máy người đóng<span class="grow"></span><button type="button" class="btn sm" onclick="delBagVideo()">Bỏ, quay video khác</button></div>';
    return '<div class="vidok">✓ Video hiện có' + (b.cleaned ? ' (đã xóa sau 30 ngày)' : '') + '<span class="grow"></span>' +
      (b.cleaned ? '' : '<a class="btn sm" href="https://drive.google.com/file/d/' + esc(b.videoId) + '/view" target="_blank" rel="noopener">Xem</a>') +
      '<button type="button" class="btn sm" style="color:var(--bad)" onclick="delBagVideo()">Xóa video</button></div>';
  }
  if (b.videoId) return '<div class="vidok">✓ Video đã lưu lên Drive<span class="grow"></span><button type="button" class="btn sm" onclick="redoVideo()">' + (CAN_RECORD ? 'Quay lại' : 'Chọn lại') + '</button></div>';
  if (j && j.status === 'hold') return '<div class="stack"><div class="bold" style="color:var(--bad)">Quay bị gián đoạn</div>' +
    '<div class="small">Đã quay được <b>' + mmss(j.dur || 0) + '</b> (' + mb(j.size) + ' MB) thì bị ngắt (cuộc gọi, chuyển app hoặc tắt máy). Phần đã quay vẫn còn.</div>' +
    '<div class="row wrapflex"><button type="button" class="btn pri sm" onclick="keepCutVideo()">Giữ đoạn đã quay</button>' +
    '<button type="button" class="btn sm" onclick="redoCutVideo()">Quay lại từ đầu</button></div></div>';
  if (j) return '<div class="stack"><div class="vidok">✓ Đã quay xong · ' + mb(j.size) + ' MB<span class="grow"></span><button type="button" class="btn sm" onclick="redoVideo()">' +
    (CAN_RECORD ? 'Quay lại' : 'Chọn lại') + '</button></div>' +
    '<div class="bar"><div id="vbar" style="width:' + pct(j.sent, j.size) + '%"></div></div><div class="small muted" id="vtxt">' + vqText(j) + '</div></div>';
  if (CAN_RECORD) return '<button type="button" class="drop" onclick="recordVideo()" style="color:var(--pri-ink)">' + ICON.video +
    '<div class="bold">Quay video ngay</div><div class="muted small">Bắt buộc · Quay Full HD ngay trong app, vừa quay vừa tự lưu lên Drive</div></button>' +
    '<div class="center small"><a href="#" onclick="$(\'vfile\').click();return false">hoặc chọn video đã quay sẵn</a></div>';
  return '<button type="button" class="drop" onclick="$(\'vfile\').click()" style="color:var(--pri-ink)">' + ICON.up +
    '<div class="bold">Chọn video đã quay</div><div class="muted small">Bắt buộc · Quay bằng app Camera trước (1080p), rồi bấm đây chọn video</div></button>' +
    '<div class="center small"><a href="#" onclick="$(\'vcap\').click();return false">hoặc quay nhanh bằng máy quay</a>' +
    (IS_IOS ? '<div class="muted" style="margin-top:2px">Trên iPhone, quay nhanh sẽ bị mờ, chỉ dùng khi gấp</div>' : '') + '</div>';
}

function blobToB64(blob) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

/* ---------- Chụp ảnh ---------- */
function gotPhotos(input) {
  var files = Array.prototype.slice.call(input.files || []); input.value = '';
  files.forEach(function (f) {
    compressImage(f, 1280, 0.75).then(function (dataUrl) {
      var bag = S.bag;
      var p = { thumb: dataUrl, id: null };
      bag.photos.push(p); viewBag();
      return bag.ready.then(function () { return call('uploadPhoto', { bagId: bag.bagId, dataUrl: dataUrl }, { quiet: true }); }).then(function (r) {
        p.id = r.fileId; if (S.bag === bag) viewBag();
      }).catch(function () {
        bag.photos.splice(bag.photos.indexOf(p), 1); if (S.bag === bag) viewBag();
      });
    });
  });
}

function compressImage(file, max, q) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q));
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ===================== TÀI KHOẢN ===================== */
function loadUsers() {
  call('listUsers', {}, { text: 'Đang tải tài khoản…' }).then(function (u) { S.users = u; viewUsers(); });
}
function viewUsers() {
  var rows = S.users.map(function (u) {
    return '<div class="card row between wrapflex"><div class="grow"><div class="bold">' + esc(u.hoTen) + '</div>' +
      '<div class="muted small">' + esc(u.username) + ' · ' + (u.role === 'admin' ? 'Quản trị' : 'Nhân viên') + '</div></div>' +
      (u.active ? '<span class="chip ok">Đang dùng</span>' : '<span class="chip bad">Đã khóa</span>') +
      (u.username !== S.user.username ?
        '<div class="row"><button type="button" class="btn sm" onclick="resetPw(\'' + esc(u.username) + '\')">Đổi mật khẩu</button>' +
        '<button type="button" class="btn sm ' + (u.active ? 'danger' : '') + '" onclick="toggleUser(\'' + esc(u.username) + '\',' + !u.active + ')">' + (u.active ? 'Khóa' : 'Mở khóa') + '</button></div>' : '') +
      '</div>';
  }).join('');
  render('<div class="wrap stack" style="max-width:640px"><div class="title">Tài khoản</div>' + rows +
    '<form class="card stack" onsubmit="addUser(event)"><h3 style="margin:0">Thêm tài khoản</h3>' +
    '<label class="f">Họ tên<input class="in" id="nh" required></label>' +
    '<div class="grid2"><label class="f">Tên đăng nhập<input class="in" id="nu" autocapitalize="none" required></label>' +
    '<label class="f">Mật khẩu<input class="in" id="np" type="text" autocomplete="off" required></label></div>' +
    '<label class="f">Quyền<select class="in" id="nr"><option value="staff">Nhân viên (chỉ nhập liệu)</option><option value="admin">Quản trị</option></select></label>' +
    '<button type="submit" class="btn pri">Tạo tài khoản</button></form></div>' + nav('users'));
}
function addUser(e) {
  e.preventDefault();
  call('createUser', { hoTen: $('nh').value, username: $('nu').value, password: $('np').value, role: $('nr').value })
    .then(function () { toast('Đã tạo tài khoản.'); loadUsers(); });
}
function toggleUser(u, active) {
  call('setUserActive', { username: u, active: active }).then(function () { loadUsers(); });
}
function resetPw(u) {
  ask('Mật khẩu mới cho ' + u + ' (ít nhất 6 ký tự):', { input: true, ok: 'Đổi mật khẩu' }).then(function (p) {
    if (!p) return;
    call('resetPassword', { username: u, password: p }).then(function () { toast('Đã đổi mật khẩu.'); });
  });
}

boot();
</script>
