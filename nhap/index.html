  <style>
/* Giao diện mới: nền trắng, menu XANH LÁ ĐẬM, điểm nhấn VÀNG ĐẬM, chữ to & đậm */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --line:#E3E7E1; --field:#F7F9F6; --field-line:#CFD6CC;
  --ink:#1D6340; --ink2:#267550; --ink-text:#EAF3EC; --ink-muted:#B9D6C3;
  --pri:#E8A21E; --pri-hover:#D69214; --pri-ink:#1A1200; --soft:#FFF0C9; --soft-ink:#5E3D00; --accent:#E8A21E;
  --text:#14201A; --text2:#33413A; --muted:#5D6862;
  --ok-bg:#E2F2E7; --ok:#1F6B3E; --warn-bg:#FFEACC; --warn:#8A4B00; --bad-bg:#FDE3E1; --bad:#A1251C;
  --nav-w:232px;
  --surface:#FFFFFF; --hi:var(--hi); --on-ink:#FFFFFF; --track:var(--track); --tint:var(--tint); --tabs-bg:var(--tabs-bg); --th-bg:var(--th-bg); --need-bg:var(--need-bg); --dash:var(--dash);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;font-weight:500}
a{color:#8A5D00;font-weight:600}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 110px}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.bold{font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(90,62,43,.06)}
.card h3{margin:0 0 8px;font-size:17px;font-weight:800;color:var(--text)}
.title{font-size:23px;font-weight:800;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pri)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.chip.soft{background:var(--soft);color:var(--soft-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.dark{background:var(--ink);color:var(--on-ink)}
/* Ô số liệu kiểu thẻ */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(90,62,43,.06)}
.stat .lb{font-size:13px;font-weight:700;color:var(--text2)}
.stat .v{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.hi{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.stat.hi .lb{color:var(--ink-text)} .stat.hi .s{color:var(--ink-muted)} .stat.hi .v{color:var(--hi)}
@media (min-width:700px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr))} }
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--text2)}
.in{height:50px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--field);padding:0 14px;font-size:16px;font-weight:600;min-width:0;width:100%}
.in:focus{outline:2px solid var(--pri);outline-offset:0;background:var(--surface)}
.btn{height:52px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--surface);padding:0 18px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#BFC5B8}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:800}
.btn.pri:hover{background:var(--pri-hover);border-color:var(--pri-hover)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.danger{color:var(--bad);border-color:#F2C1BC}
.btn.sm{height:42px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:46px;height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text)}
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>div{height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.tabs{display:flex;gap:6px;background:var(--tabs-bg);padding:4px;border-radius:12px;align-self:flex-start}
.tab{height:42px;padding:0 16px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--text2);cursor:pointer}
.tab.on{background:var(--ink);color:var(--on-ink)}
.lotcard{cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;transition:border-color .15s}
.lotcard:hover{border-color:var(--pri)}
.sku{display:flex;flex-direction:column;gap:5px}
.pick{cursor:pointer;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.pick.on{border:2.5px solid var(--pri);background:var(--tint)}
.pick.dim{opacity:.55}
/* Barcode dùng chung nhiều SKU (bản thường / Premium): phân loại chữ to, Premium tô nổi */
.chip.twin{font-size:12px;padding:3px 9px;white-space:normal}
.plbig{font-size:16px;font-weight:800;color:var(--text);margin-top:2px}
.prem{background:var(--ink);color:var(--on-ink);border-radius:6px;padding:0 6px;font-weight:800}
.twinwarn{background:var(--warn-bg);border-color:#F2D3A6;color:var(--warn)}
.twinwarn .muted{color:var(--warn);opacity:.75}
.chooser .grouphd{font-size:13px;font-weight:800;color:var(--text2);margin:6px 2px 0}
/* */.drop{border:2px dashed var(--dash);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--tint);cursor:pointer;width:100%}

    function done(v) { box.hidden = true; $('askOk').onclick = $('askNo').onclick = null; resolve(v); }
    $('askOk').onclick = function () { done(opts.input ? inp.value : true); };
    $('askNo').onclick = function () { done(opts.input ? null : false); };
  });
}

function call(action, data, opts) {
  opts = opts || {};
  if (!opts.quiet) busy(true, opts.text);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!opts.quiet) busy(false);
        if (res && res.ok) return resolve(res.data);
        var err = (res && res.error) || ('Có lỗi xảy ra (' + action + ').');
        if (err.indexOf('AUTH:') === 0) { logoutLocal(); toast(err.slice(5).trim(), true); return reject(new Error(err)); }
        if (!opts.silent) toast(err, true);
        reject(new Error(err));
      })
      .withFailureHandler(function (e) {
        if (!opts.quiet) busy(false);
        var m = (e && e.message) || 'Mất kết nối, vui lòng thử lại.';
        if (!opts.silent) toast(m, true);
        reject(e);
      })
      .api({ token: S.token, action: action, data: data || {} });
  });
}

/* Mở app: hiện màn hình ngay từ dữ liệu đã lưu trên máy, hỏi máy chủ chạy ngầm phía sau
   (mỗi lần hỏi Google Apps Script mất 2–10 giây, không bắt người dùng nhìn "Đang tải…"). */
function boot() {
  S.token = load('godfbs_token');
  var savedUser = null;
  try { savedUser = JSON.parse(load('godfbs_user') || 'null'); } catch (e) { savedUser = null; }
  if (S.token && savedUser) {
    // Đã đăng nhập trên máy này: vào thẳng danh sách lô, kiểm tra phiên ngầm
    S.user = savedUser; S.kho = load('godfbs_kho'); go('lots'); vqInit();
    call('me', {}, { quiet: true, silent: true }).then(function (d) {
      var roleChanged = !S.user || S.user.role !== d.user.role;
      S.user = d.user; S.tinhTrang = d.tinhTrang || S.tinhTrang;
      store('godfbs_user', JSON.stringify(d.user));
      if (roleChanged && S.view === 'lots' && S.lots && S.lots.length && !editing()) viewLots(true);
    }).catch(function () { /* hết phiên thì call() đã tự đưa về đăng nhập; mất mạng thì vẫn dùng dữ liệu đã lưu */ });
  } else if (S.token) {
    // Máy đăng nhập từ bản cũ (chưa lưu người dùng): làm như trước, 1 lần duy nhất
    call('me', {}, { quiet: true, silent: true }).then(function (d) {
      S.user = d.user; S.tinhTrang = d.tinhTrang; S.kho = load('godfbs_kho');
      store('godfbs_user', JSON.stringify(d.user)); store('godfbs_has_users', '1');
      go('lots'); vqInit();
    }).catch(function () { logoutLocal(); });
  } else if (load('godfbs_has_users') === '1') {
    // Máy này đã từng thấy có tài khoản: hiện ô đăng nhập ngay, không cần hỏi máy chủ
    viewLogin();
  } else {
    call('status', {}, { quiet: true }).then(function (d) {
      if (d.hasUsers) { store('godfbs_has_users', '1'); viewLogin(); } else viewSetup();
    });
  }
}

function logoutLocal() { VQ.inited = false; VQ.jobs.forEach(function (j) { j.dead = true; }); VQ.jobs = []; vqBar(); if (S.user) store(lotsKey(), null); S.token = null; S.user = null; S.lots = []; S.lotCache = {}; store('godfbs_token', null); store('godfbs_user', null); viewLogin(); }

  Promise.resolve(true).then(function (ok) {
    if (!ok) return;
    call('logout', {}, { quiet: true, silent: true }).catch(function () {});
    logoutLocal();
  });
}

function loadLots() {
  var cached = S.lots && S.lots.length ? S.lots : null;
  if (!cached) { try { cached = JSON.parse(load(lotsKey()) || 'null'); } catch (e) { cached = null; } }
  if (cached) { S.lots = cached; viewLots(); syncing(true); }
  call('listLots', {}, cached ? { quiet: true, silent: true } : { text: 'Đang tải lô hàng…' }).then(function (lots) {
    if (cached) syncing(false);
    var changed = !cached || !same(lots, S.lots);
    S.lots = lots; store(lotsKey(), JSON.stringify(lots));
    if (S.view === 'lots' && changed && !editing()) viewLots(!!cached);
    prefetchLots(lots);
  }).catch(function () {
    if (!cached) return;
    syncing(false); toast('Chưa cập nhật được danh sách lô (mất kết nối).', true);
  });
}
/* Tải sẵn ngầm vài lô đang đóng để bấm vào là mở ngay */

  var ids = lots.filter(function (l) { return l.status !== 'done' && !S.lotCache[l.lotId]; })
    .slice(0, 3).map(function (l) { return l.lotId; });

    var id = ids.shift(); if (!id) return;
    call('getLot', { lotId: id }, { quiet: true, silent: true })
      .then(function (d) { if (!S.lotCache[id]) S.lotCache[id] = d; next(); })

      '<div class="row wrapflex small" style="color:var(--text2);gap:14px"><span>' + esc(l.kho) + '</span><span>' + l.skuCount + ' SKU</span><span>' + l.bagCount + ' bao</span></div>' +
      '<div class="stack" style="gap:6px"><div class="bar"><div style="width:' + pct(l.slDong, l.slCan) + '%"></div></div>' +
      '<div class="row between small muted"><span>Đã đóng ' + l.slDong + ' / ' + l.slCan + ' pcs</span><span>ASN: ' + (l.asn ? esc(l.asn) : 'chưa nhập') + '</span></div></div>' +
      '</button>';
  }).join('');
  render('<div class="wrap stack">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Về Đóng Hàng FBS" onclick="goHome()">' + ICON.back + '</button>' +
    '<div class="grow"><div class="eyebrow">Đóng Hàng FBS</div><div class="title">' + KHO_TEN[S.kho] + '</div></div>' +
    '<span class="chip soft">' + S.kho + '</span></div>' +
    lotStats(open, done) +
    '<div class="tabs"><button type="button" class="tab ' + (S.tab === 'open' ? 'on' : '') + '" onclick="setTab(\'open\')">Đang đóng (' + open.length + ')</button>' +
    '<button type="button" class="tab ' + (S.tab === 'done' ? 'on' : '') + '" onclick="setTab(\'done\')">Đã xong (' + done.length + ')</button></div>' +
    (cards || '<div class="card center muted">' + KHO_TEN[S.kho] + ' chưa có PO nào ' + (S.tab === 'open' ? 'đang đóng' : 'đã xong') + '.</div>') +
    (isAdmin() ? '<button type="button" class="drop" onclick="go(\'import\')" style="color:var(--pri-ink)">' + ICON.up +
      '<div class="bold">Tải file gốc của lần xuất mới</div><div class="muted small">Dán link Google Sheet file gốc</div></button>' : '') +
    '</div>' + nav('lots'), keep);
}

/* ===================== TẢI FILE GỐC ===================== */
function viewImport() {
  var info = S.importInfo;
  var sheets = info ? info.sheets.map(function (s, i) {
    return '<label class="check"><input type="radio" name="sh" value="' + esc(s.name) + '" ' + (i === 0 ? 'checked' : '') +
      ' onchange="pickSheet(this.value)">' + esc(s.name) + (s.kho ? ' <span class="chip soft">' + s.kho + '</span>' : '') + '</label>';
  }).join('') : '';
  var first = info && info.sheets[0];
  render('<div class="wrap stack" style="max-width:640px">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Quay lại" onclick="S.importInfo=null;go(\'lots\')">' + ICON.back + '</button>' +
    '<div class="title">Tải file gốc</div></div>' +
    '<div class="card stack"><label class="f">Link Google Sheet file gốc<input class="in" id="iu" value="' + esc(info ? info.url : '') + '" placeholder="https://docs.google.com/spreadsheets/d/…"></label>' +
    '<div class="muted small">File cần được chia sẻ quyền chỉnh sửa cho tài khoản chạy phần mềm.</div>' +
    '<button type="button" class="btn" onclick="readSource()">Đọc file</button></div>' +
    (info ? '<div class="card stack"><div class="bold">' + esc(info.title) + '</div><div class="muted small">Chọn sheet của lần xuất này:</div>' + sheets +
      '<div class="grid2"><label class="f">Kho nhận<select class="in" id="ik">' +
      '<option value="">Chọn kho…</option><option value="VNVL"' + (first && first.kho === 'VNVL' ? ' selected' : '') + '>VNVL · Long An</option>' +
      '<option value="VNNL"' + (first && first.kho === 'VNNL' ? ' selected' : '') + '>VNNL · Bắc Ninh</option></select></label>' +
      '<label class="f">ASN (nhập sau cũng được)<input class="in" id="ia"></label></div>' +
      '<button type="button" class="btn pri" onclick="doImport()">Tải lô hàng lên</button></div>' : '') +
    '</div>' + nav('lots'));
}
function readSource() {
  var url = $('iu').value.trim();
  if (!url) return toast('Chưa dán link.', true);
  call('previewSource', { url: url }, { text: 'Đang đọc file…' }).then(function (d) {
    S.importInfo = { url: url, title: d.title, sheets: d.sheets }; viewImport();
  });
}
function pickSheet(name) {
  var s = S.importInfo.sheets.filter(function (x) { return x.name === name; })[0];
  if (s && s.kho) $('ik').value = s.kho;
}
function doImport() {
  var el = document.querySelector('input[name=sh]:checked');
  var kho = $('ik').value;
  if (!kho) return toast('Chọn kho nhận trước nhé.', true);
  call('importLot', { url: S.importInfo.url, sheetName: el ? el.value : '', kho: kho, asn: $('ia').value }, { text: 'Đang tải lô hàng…' })
    .then(function (d) { S.importInfo = null; toast('Đã tải lô hàng.'); go('lot', d.lotId); });
}

/* ===================== CHI TIẾT LÔ ===================== */
/** Hiện lô từ dữ liệu máy chủ trả về luôn, khỏi gọi tải lại lần 2. */
function showLot(d) {
  if (!d || !d.lot) { S.view = 'lot'; return loadLot(); }
  S.lotId = d.lot.lotId; S.view = 'lot'; S.detail = d; S.lotCache[d.lot.lotId] = d; viewLot();
}
/** Ghi file gốc ngầm phía sau, chỉ báo khi có lỗi. */
function syncLot(lotId, reset) {
  call('syncLot', { lotId: lotId, reset: reset || [] }, { quiet: true, silent: true }).then(function (r) {
    if (r && r.error) toast('Chưa ghi được vào file gốc: ' + r.error + ' (Quản trị bấm "Ghi vào file gốc" để ghi lại.)', true);
  }).catch(function () { toast('Chưa ghi được vào file gốc (mất kết nối). Quản trị bấm "Ghi vào file gốc" để ghi lại.', true); });
}
/* Mở ngay lô đã nhớ, rồi lấy bản mới ngầm phía sau */
function loadLot() {
  var id = S.lotId, cached = S.lotCache[id];
  if (cached) { S.detail = cached; viewLot(); syncing(true); }
  call('getLot', { lotId: id }, cached ? { quiet: true, silent: true } : { text: 'Đang tải lô…' }).then(function (d) {
    if (cached) syncing(false);
    S.lotCache[id] = d;
    if (S.view !== 'lot' || S.lotId !== id || S.bag) return;
    var changed = !cached || !same(d, S.detail);
    S.detail = d;
    if (changed && !editing()) viewLot(!!cached);
  }).catch(function () {
    if (!cached) return;
    syncing(false); toast('Chưa cập nhật được lô (mất kết nối).', true);
  });
}

/* Barcode dùng chung cho nhiều SKU (vd bản thường + Premium): nhãn cảnh báo + phân loại chữ to, chữ Premium tô nổi */
function twinTag(i) { return i && i.twin ? '<span class="chip warn twin">⚠️ Chung barcode · xem kỹ phân loại</span>' : ''; }
function plHtml(pl) { return esc(pl).replace(/premium/ig, function (m) { return '<span class="prem">' + m + '</span>'; }); }
function plLine(i) {
  return i.twin ? '<div class="plbig">' + plHtml(i.phanLoai) + '</div>'
    : '<div class="small" style="color:var(--text2)">' + esc(i.phanLoai) + '</div>';
}
function itemLabel(i) { return (i.barcode || i.sku) + (i.twin ? ' (' + i.phanLoai + ')' : ''); }

function skuChip(i, lotDone) {
  if (i.slDong >= i.slCan && i.slCan > 0) return '<span class="chip ok">Đã đủ</span>';
  if (i.slDong > 0) return '<span class="chip soft">Đang đóng</span>';
  if (lotDone) return '<span class="chip bad">Thiếu hàng</span>';
  return '<span class="chip warn">Chưa đóng</span>';
}

function viewLot(keep) {
  if (S.detail && S.detail.lot && KHO_TEN[S.detail.lot.kho]) { S.kho = S.detail.lot.kho; store('godfbs_kho', S.kho); }
  var d = S.detail, l = d.lot, done = l.status === 'done';
  var slCan = 0, slDong = 0;
  d.items.forEach(function (i) { slCan += i.slCan; slDong += i.slDong; });

  var info = isAdmin()
    ? '<div class="grid2"><label class="f">Mã PO<input class="in" id="lpo" value="' + esc(l.po) + '"></label>' +
      '<label class="f">ASN<input class="in" id="lasn" value="' + esc(l.asn) + '" placeholder="Nhập mã ASN"></label></div>' +
      '<label class="f">Kho nhận<select class="in" id="lkho">' + d.khoList.map(function (k) {
        return '<option value="' + k.code + '"' + (k.code === l.kho ? ' selected' : '') + '>' + esc(k.text) + '</option>';
      }).join('') + '</select></label>' +
      '<button type="button" class="btn sm" onclick="saveLotInfo()">Lưu thông tin lô</button>'
    : '<div class="grid2"><div><div class="muted small">ASN</div><div class="bold">' + esc(l.asn || 'chưa nhập') + '</div></div>' +
      '<div><div class="muted small">Kho nhận</div><div class="bold">' + esc(l.kho) + '</div></div></div>';

  var skuQ = foldQ(S.skuQ && S.skuQ.lot === d.lot.lotId ? S.skuQ.v : '').trim(), skuN = 0;
  var items = d.items.map(function (i) {
    var dq = foldQ([i.barcode, i.sku, i.phanLoai, i.ten, i.maKien].join(' '));
    var hit = !skuQ || dq.indexOf(skuQ) >= 0; if (hit) skuN++;
    return '<div class="card sku" data-q="' + esc(dq) + '"' + (hit ? '' : ' style="display:none"') + '><div class="row between" style="align-items:flex-start"><div class="grow">' +
      '<div class="bold">' + esc(i.barcode || i.sku) + '</div>' +
      (i.twin ? '<div class="small bold">' + plHtml(i.phanLoai) + '</div><div class="muted small">SKU ' + esc(i.sku) + '</div>'
        : '<div class="muted small">' + esc(i.phanLoai) + ' · SKU ' + esc(i.sku) + '</div>') + twinTag(i) + '</div>' +
      skuChip(i, done) + '</div><div class="row between small" style="color:var(--text2)"><span>Đóng ' + i.slDong + ' / ' + i.slCan + ' pcs</span>' +
      '<span>' + (i.maKien ? 'Kiện ' + esc(i.maKien) : '') + '</span></div></div>';
  }).join('');

  var bags = d.bags.map(function (b) {
    return '<tr><td>' + b.baoNo + '</td><td>' + esc(b.barcode) +
      (b.phanLoai ? '<div class="small' + (b.twin ? ' bold' : ' muted') + '">' + (b.twin ? '⚠️ ' + plHtml(b.phanLoai) : esc(b.phanLoai)) + '</div>' : '') +
      '</td><td class="num">' + b.qty + '</td><td>' + esc(b.tinhTrang) + '</td>' +
      '<td>' + esc(b.user) + '</td><td>' + esc(b.createdAt) + '</td>' +
      (isAdmin() ? '<td>' + (b.cleaned ? '<span class="muted">Đã xóa sau 30 ngày</span>' :
        (b.videoPending ? '<span class="chip warn">⏳ Video đang tải</span>' : '<a href="' + esc(b.videoUrl) + '" target="_top">Xem video</a>') + ' · <a href="' + esc(b.folderUrl) + '" target="_top">Ảnh</a>') +
        (!done ? ' · <a href="#" onclick="openEditBag(\'' + esc(b.bagId) + '\');return false">Sửa bao</a>' +
          ' · <a href="#" onclick="delBag(\'' + esc(b.bagId) + '\',' + b.baoNo + ');return false" style="color:var(--bad)">Xóa</a>' : '') + '</td>'
        : '<td>' + evidenceChip(b) + '</td>') + '</tr>';
  }).join('');

  // Cảnh báo đầu lô: các barcode trong file gốc dùng chung cho nhiều SKU (phân biệt bằng phân loại / SKU)
  var twinGroups = {}, twinOrder = [];
  d.items.forEach(function (i) {
    if (!i.twin) return;
    var k = String(i.barcode || '').trim();
    if (!twinGroups[k]) { twinGroups[k] = []; twinOrder.push(k); }
    twinGroups[k].push(i);
  });
  var twinWarn = twinOrder.length ? '<div class="card stack twinwarn" style="gap:6px">' +
    '<div class="bold">⚠️ Lô này có ' + twinOrder.length + ' barcode dùng chung cho nhiều SKU</div>' +
    '<div class="small">Khi đóng các hàng này, xem kỹ <b>phân loại</b> trên hàng thật (có <b>Premium</b> hay không) rồi chọn đúng SKU.</div>' +
    '<div class="small stack" style="gap:4px">' + twinOrder.map(function (k) {
      return '<div><b>' + esc(k) + '</b>: ' + twinGroups[k].map(function (i) {
        return plHtml(i.phanLoai) + ' <span class="muted">(đã đóng ' + i.slDong + '/' + i.slCan + ')</span>' +
          (i.slDong > i.slCan ? ' <b style="color:var(--bad)">dư ' + (i.slDong - i.slCan) + ', kiểm tra nhầm loại</b>' : '');
      }).join(' · ') + '</div>';
    }).join('') + '</div></div>' : '';

  var drafts = d.drafts.length ? '<div class="muted small">Đang đóng dở: ' + d.drafts.map(function (x) { return 'bao ' + x.baoNo + ' (' + esc(x.user) + ')'; }).join(', ') + '</div>' : '';

  var pxk = '';
  if (isAdmin()) {
    var rows = d.items.filter(function (i) { return i.slDong > 0; }).map(function (i, k) {
      return '<tr><td>' + (k + 1) + '</td><td>' + esc(i.sku) + '</td><td>' + esc(i.ten) + '</td><td>' + esc(i.phanLoai) + '</td><td>pcs</td>' +
        '<td class="num">' + i.slCan + '</td><td class="num">' + i.slDong + '</td><td class="num">' + i.soKien + '</td><td>' + esc(i.maKien) + '</td><td>' + esc(i.ghiChu) + '</td></tr>';
    }).join('');
    pxk = '<div class="card stack"><div class="row between wrapflex"><h3 style="margin:0">Xem trước phiếu xuất kho</h3>' +
      '<span class="muted small">SKU chưa đóng / thiếu hàng không đưa vào phiếu</span></div>' +
      '<div class="tablebox"><table class="t"><thead><tr><th>STT</th><th>Mã SKU</th><th>Tên sản phẩm</th><th>Phân loại</th><th>ĐVT</th>' +
      '<th class="num">SL xác nhận</th><th class="num">SL giao</th><th class="num">SL kiện</th><th>Mã kiện</th><th>Ghi chú</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="10" class="muted">Chưa có bao nào.</td></tr>') + '</tbody></table></div>' +
      '<div class="row wrapflex">' +
      '<button type="button" class="btn" onclick="doWriteBack()">Ghi vào file gốc</button>' +
      '<button type="button" class="btn pri" onclick="doExport()">Xuất phiếu xuất kho</button>' +
      (done ? '<button type="button" class="btn" onclick="setLotStatus(\'open\')">Mở lại lô</button>'
            : '<button type="button" class="btn" onclick="setLotStatus(\'done\')">Hoàn tất lô</button>') +
      '<button type="button" class="btn danger" onclick="deleteLot()">Xóa lô khỏi phần mềm</button></div>' +
      '<div class="row wrapflex small">' +
      (l.pxkUrl ? '<a href="' + esc(l.pxkUrl) + '" target="_top">Mở phiếu xuất kho vừa xuất</a>' : '') +
      '<a href="' + esc(l.srcUrl) + '" target="_top">Mở file gốc</a>' +
      '<a href="' + esc(l.folderUrl) + '" target="_top">Thư mục video & ảnh</a></div></div>';
  }

  render('<div class="wrap stack" style="padding-bottom:160px">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Quay lại" onclick="go(\'lots\')">' + ICON.back + '</button>' +
    '<div class="grow"><div class="eyebrow">' + (KHO_TEN[l.kho] || 'Lô hàng') + (l.han ? ' · Hạn giao ' + esc(l.han) : '') + (done ? ' · Đã hoàn tất' : '') + '</div>' +
    '<div class="title" style="word-break:break-all">' + esc(poName(l)) + '</div></div>' +
    '<button type="button" class="iconbtn" aria-label="Tải lại" onclick="loadLot()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button></div>' +
    '<div class="split"><div class="main stack">' + twinWarn +
    '<div class="card stack">' + info +
    '<div class="stack" style="gap:6px"><div class="bar"><div style="width:' + pct(slDong, slCan) + '%"></div></div>' +
    '<div class="row between small muted"><span>Đã đóng ' + slDong + ' / ' + slCan + ' pcs · ' + d.bags.length + ' bao</span></div></div>' + drafts + '</div>' +
    pxk +
    '<div class="card stack"><div class="row between"><h3 style="margin:0">Các bao đã chốt (' + d.bags.length + ')</h3>' +
    (isAdmin() && !done ? '<button type="button" class="btn sm" onclick="showManualBag()">+ Thêm bao thủ công</button>' : '') + '</div><div class="tablebox"><table class="t" style="min-width:560px"><thead><tr><th>Bao</th><th>Barcode</th><th class="num">SL</th><th>Tình trạng</th><th>Người đóng</th><th>Thời gian</th>' +
    '<th>Bằng chứng</th></tr></thead><tbody>' + (bags || '<tr><td colspan="7" class="muted">Chưa có bao nào.</td></tr>') + '</tbody></table></div></div>' +
    '</div><div class="side stack"><div class="bold">Danh sách SKU (' + d.items.length + ')</div>' +
    '<input class="in" type="search" id="skuq" placeholder="Tìm SKU, barcode, phân loại…" value="' + esc(skuQ ? S.skuQ.v : '') + '" oninput="filterSkuList(this.value,\'' + esc(d.lot.lotId) + '\')">' +
    '<div class="muted small" id="skuqn"' + (skuQ ? '' : ' style="display:none"') + '>' + (skuQ ? (skuN ? 'Thấy ' + skuN + ' SKU' : 'Không thấy SKU nào khớp') : '') + '</div>' + items + '</div></div>' +
    '</div>' +
    (!done ? '<div class="sticky"><div class="inner"><button type="button" class="btn pri block" onclick="newBag()">+ Đóng bao mới</button></div></div>' : '') +
    nav('lots'), keep);
}

function saveLotInfo() {
  call('updateLot', { lotId: S.lotId, po: $('lpo').value, asn: $('lasn').value, kho: $('lkho').value }).then(function (d) { toast('Đã lưu.'); showLot(d); });
}
function setLotStatus(st) {
  var msg = st === 'done' ? 'Hoàn tất lô? SKU chưa đóng sẽ ghi SL thực tế = 0 vào file gốc.' : 'Mở lại lô để đóng thêm bao?';
  ask(msg).then(function (ok) {
    if (!ok) return;
    call('setLotStatus', { lotId: S.lotId, status: st }).then(function (d) { toast('Đã cập nhật.'); showLot(d); });
  });
}
function doWriteBack() {
  ask('Ghi kết quả vào file gốc? SKU chưa có bao sẽ ghi SL thực tế = 0.').then(function (ok) {
    if (!ok) return;
    call('writeBack', { lotId: S.lotId }, { text: 'Đang ghi vào file gốc…' }).then(function () { toast('Đã ghi vào file gốc.'); });
  });
}
function doExport() {
  var asn = S.detail && S.detail.lot && String(S.detail.lot.asn || '').trim();
  (asn ? Promise.resolve(true) : ask('Lô chưa có ASN (nhập ASN rồi bấm "Lưu thông tin lô"). Phiếu sẽ không có mã QR. Vẫn xuất?'))
    .then(function (ok) { if (ok) exportNow(); });
}
function exportNow() {
  call('exportPxk', { lotId: S.lotId }, { text: 'Đang tạo phiếu xuất kho…' }).then(function (r) {
    loadLot();
    if (r.warning) toast(r.warning, true);
    // Mở bằng cú bấm của người dùng để trình duyệt không chặn tab mới
    ask('Đã tạo phiếu xuất kho:\n' + r.name, { ok: 'Mở phiếu' }).then(function (open) {
      if (open) window.open(r.url, '_top');   // mở ngay trong tab này, bấm ← để quay lại
    });
  });
}
function deleteLot() {
  ask('Xóa lô ' + poName(S.detail.lot) + ' khỏi phần mềm? Các bao, video và ảnh của lô sẽ vào thùng rác Drive. File gốc KHÔNG bị thay đổi.', { ok: 'Xóa lô', danger: true }).then(function (ok) {
    if (!ok) return;
    var id = S.lotId;
    call('deleteLot', { lotId: id }, { text: 'Đang xóa lô…' }).then(function () {
      delete S.lotCache[id]; S.lots = S.lots.filter(function (l) { return l.lotId !== id; });
      toast('Đã xóa lô.'); go('lots');
    });
  });
}
function delBag(id, no) {
  ask('Xóa bao số ' + no + '? Video và ảnh của bao sẽ vào thùng rác.', { ok: 'Xóa bao', danger: true }).then(function (ok) {
    if (!ok) return;
    var old = (S.detail.bags.filter(function (b) { return b.bagId === id; })[0] || {}).sku;
    call('deleteBag', { bagId: id }).then(function (d) { toast('Đã xóa bao.'); showLot(d); syncLot(S.lotId, old ? [old] : []); });
  });
}

/* Quản trị viên đổi hàng (SKU) của bao đã chốt — dùng khi nhân viên chọn nhầm loại cùng barcode (bản thường / Premium). */
function showChangeBag(bagId) {
  var b = S.detail.bags.filter(function (x) { return x.bagId === bagId; })[0];
  if (!b) return;
  var cur = S.detail.items.filter(function (i) { return i.sku === b.sku; })[0] || { barcode: b.barcode, phanLoai: b.phanLoai, sku: b.sku };
  var bc = normCode(cur.barcode);
  var others = S.detail.items.filter(function (i) { return i.sku !== b.sku; });
  var twins = bc ? others.filter(function (i) { return normCode(i.barcode) === bc; }) : [];
  var rest = others.filter(function (i) { return twins.indexOf(i) < 0; });
  var btn = function (i) {
    return '<button type="button" class="pick" onclick="doChangeBag(\'' + esc(bagId) + '\',\'' + esc(i.sku) + '\')">' +
      '<div class="bold" style="font-size:14px">' + esc(i.barcode || i.sku) + '</div>' + plLine(i) +
      '<div class="muted small">SKU ' + esc(i.sku) + ' · Cần ' + i.slCan + ' · Đã đóng ' + i.slDong + '</div></button>';
  };
  var box = document.createElement('div');
  box.className = 'scanbox'; box.id = 'scanbox';
  box.innerHTML = '<div class="scanhead"><div class="bold">Đổi hàng của bao số ' + b.baoNo + '</div><button type="button" class="btn sm" onclick="closeScanner()">Đóng</button></div>' +
    '<div class="chooser"><div class="stack" style="gap:8px">' +
    '<div class="card stack" style="gap:4px"><div class="muted small">Đang ghi là</div>' +
    '<div class="bold" style="font-size:18px">' + esc(cur.barcode || cur.sku) + '</div><div class="plbig">' + plHtml(cur.phanLoai) + '</div>' +
    '<div class="muted small">SKU ' + esc(cur.sku) + ' · ' + b.qty + ' pcs</div>' +
    '<div class="small">Chọn đúng hàng của bao này bên dưới. Video và ảnh của bao giữ nguyên.</div></div>' +
    (twins.length ? '<div class="grouphd">Cùng barcode ' + esc(cur.barcode) + '</div>' + twins.map(btn).join('') : '') +
    '<div class="grouphd">Hàng khác trong lô</div>' + rest.map(btn).join('') +
    '</div></div>';
  var old = $('scanbox'); if (old) old.remove();
  document.body.appendChild(box);
}
function doChangeBag(bagId, sku) {
  var b = S.detail.bags.filter(function (x) { return x.bagId === bagId; })[0];
  var it = S.detail.items.filter(function (i) { return i.sku === sku; })[0];
  if (!b || !it) return;
  closeScanner();   // đóng bảng chọn trước để hộp hỏi không bị che
  ask('Đổi bao số ' + b.baoNo + ' (' + b.qty + ' pcs) sang ' + itemLabel(it) + ' · SKU ' + it.sku + '?', { ok: 'Đổi hàng' }).then(function (ok) {
    if (!ok) return;
    call('changeBagSku', { bagId: bagId, sku: sku }, { text: 'Đang đổi hàng của bao…' }).then(function (r) {
      toast('Đã đổi bao số ' + b.baoNo + ' sang ' + itemLabel(it) + '. Nhớ xuất lại phiếu xuất kho.');
      showLot(r.detail);
      syncLot(S.lotId, [r.oldSku]);
    });
  });
}

/* ===================== SỬA BAO / THÊM BAO THỦ CÔNG (quản trị viên) ===================== */
/* Số đã đóng của SKU, không tính chính bao đang sửa */
function bagDong(it) {
  var b = S.bag;
  return it.slDong - (b && b.mode === 'edit' && it.sku === b.origSku ? Number(b.origQty) || 0 : 0);
}
function showManualBag() {
  var d = S.detail, used = {}, max = 0;
  d.bags.forEach(function (b) { used[b.baoNo] = 1; max = Math.max(max, b.baoNo); });
  (d.drafts || []).forEach(function (b) { used[b.baoNo] = 1; max = Math.max(max, b.baoNo); });
  var gaps = [];
  for (var n = 1; n <= max; n++) if (!used[n]) gaps.push(n);
  var box = document.createElement('div');
  box.className = 'scanbox'; box.id = 'scanbox';
  box.innerHTML = '<div class="scanhead"><div class="bold">Thêm bao thủ công</div><button type="button" class="btn sm" onclick="closeScanner()">Đóng</button></div>' +
    '<div class="chooser"><div class="stack" style="gap:10px">' +
    '<div class="card stack" style="gap:6px"><div class="small">Dùng cho bao đã đóng ngoài app. Chọn số bao, rồi chọn hàng, số lượng; video và ảnh <b>không bắt buộc</b>.</div>' +
    '<label class="f">Số bao<input class="in" type="number" inputmode="numeric" min="1" id="mbno" value="' + (gaps[0] || max + 1) + '"></label>' +
    '<button type="button" class="btn pri block" onclick="startManualBag($(\'mbno\').value)">Tiếp tục</button></div>' +
    (gaps.length ? '<div class="grouphd">Số bao đang trống (' + gaps.length + ')</div><div class="row wrapflex" style="gap:6px">' +
      gaps.map(function (n) { return '<button type="button" class="btn sm" onclick="startManualBag(' + n + ')">Bao ' + n + '</button>'; }).join('') + '</div>'
      : '<div class="muted small">Không có số bao nào bị trống từ 1 đến ' + max + '.</div>') +
    '</div></div>';
  var old = $('scanbox'); if (old) old.remove();
  document.body.appendChild(box);
}
function startManualBag(no) {
  no = Number(no);
  if (!(no >= 1)) return toast('Nhập số bao.', true);
  var lotId = S.lotId;
  call('startManualBag', { lotId: lotId, baoNo: no }, { text: 'Đang tạo bao số ' + no + '…' }).then(function (r) {
    closeScanner();
    var bag = { mode: 'manual', bagId: r.bagId, baoNo: r.baoNo, sku: null, qty: '', q: '', job: null, videoId: null,
      photos: [], danTem: false, xuatTrucTiep: false, xuatSSC: false, maDonSSC: '', slGoiThem: '', tinhTrang: '' };
    bag.ready = Promise.resolve(bag);
    vqAttach(bag);
    S.bag = bag; S.view = 'bag'; viewBag(); window.scrollTo(0, 0);
  });
}
function openEditBag(bagId) {
  call('getBagEdit', { bagId: bagId }, { text: 'Đang mở bao…' }).then(function (r) {
    var bag = { mode: 'edit', bagId: r.bagId, baoNo: r.baoNo, sku: r.sku, qty: r.qty, q: '', job: null,
      origSku: r.sku, origQty: r.qty, origVid: r.videoId, videoId: r.videoId || null, cleaned: r.cleaned,
      photos: r.photos.map(function (p) { return { id: p.id, thumb: p.thumb }; }),
      danTem: r.danTem, xuatTrucTiep: r.xuatTrucTiep, xuatSSC: r.xuatSSC, maDonSSC: r.maDonSSC, slGoiThem: r.slGoiThem, tinhTrang: r.tinhTrang };
    bag.ready = Promise.resolve(bag);
    S.bag = bag; S.view = 'bag'; viewBag(); window.scrollTo(0, 0);
  });
}
function removePhoto(n) {
  var b = S.bag; if (!b || !b.photos[n]) return;
  ask('Xóa ảnh ' + (n + 1) + ' khỏi bao? Ảnh sẽ vào thùng rác Drive khi bấm lưu.', { ok: 'Xóa ảnh', danger: true }).then(function (ok) {
    if (!ok || S.bag !== b) return;
    b.photos.splice(n, 1); viewBag();
  });
}
function delBagVideo() {
  var b = S.bag; if (!b) return;
  ask('Xóa video của bao số ' + b.baoNo + '? Video sẽ vào thùng rác Drive khi bấm lưu. Sau đó chị có thể quay hoặc chọn video khác.', { ok: 'Xóa video', danger: true }).then(function (ok) {
    if (!ok || S.bag !== b) return;
    b.videoId = null; viewBag();
  });
}
function doEditBag(b) {
  var vid = b.videoId || '';
  var pending = !vid && !!(b.job && b.job.keep);
  call('editBag', {
    bagId: b.bagId, sku: b.sku, qty: Number(b.qty), videoId: vid, videoPending: pending,
    photoIds: b.photos.map(function (p) { return p.id; }),
    danTem: b.danTem, xuatTrucTiep: b.xuatTrucTiep, xuatSSC: b.xuatSSC,
    maDonSSC: b.maDonSSC, slGoiThem: b.slGoiThem, tinhTrang: b.tinhTrang
  }, { text: 'Đang lưu bao…' }).then(function (r) {
    S.bag = null;
    VQ.jobs.filter(function (j) { return j.bagId === b.bagId && !j.dead && !j.saved; }).forEach(function (j) {
      if (vid && j.fileId === vid) return vqDrop(j);
      if (!j.keep) return vqDrop(j);
      j.saved = true; vqSave(j); vqKick();   // video mới tải xong sẽ tự gắn vào bao
    });
    toast('Đã lưu bao số ' + r.baoNo + '.' + (pending ? ' Video mới đang tự tải tiếp, đừng tắt app nhé.' : '') + ' Nhớ xuất lại phiếu xuất kho.');
    showLot(r.detail);
    syncLot(r.detail.lot.lotId, r.oldSku !== b.sku ? [r.oldSku] : []);
  });
}

/* ===================== ĐÓNG BAO ===================== */
/* Mở ngay màn hình đóng bao; số bao lấy ngầm từ máy chủ (1–2 giây) */
function newBag() {
  var lotId = S.lotId;
  var bag = { bagId: null, baoNo: null, sku: null, qty: '', q: '', job: null, videoId: null,
    photos: [], danTem: false, xuatTrucTiep: false, xuatSSC: false, maDonSSC: '', slGoiThem: '', tinhTrang: '' };
  bag.ready = call('startBag', { lotId: lotId }, { quiet: true, silent: true }).then(function (r) {
    bag.bagId = r.bagId; bag.baoNo = r.baoNo;
    if (bag.job) { bag.job.bagId = r.bagId; bag.job.baoNo = r.baoNo; }
    vqAttach(bag);
    if (S.bag === bag) [].forEach.call(document.querySelectorAll('.baono'), function (el) { el.textContent = r.baoNo; });
    return bag;
  });
  bag.ready.catch(function (e) {
    if (S.bag !== bag) return;
    if (bag.job) { vqDrop(bag.job); bag.job = null; }
    S.bag = null;
    toast('Chưa tạo được bao mới: ' + ((e && e.message) || 'mất kết nối') + '. Bấm lại "Đóng bao mới".', true);
    showLot(S.lotCache[lotId] || S.detail);
  });
  S.bag = bag; S.view = 'bag'; viewBag();
}

function bagItem() {
  var b = S.bag; if (!b || !b.sku) return null;
  return S.detail.items.filter(function (i) { return i.sku === b.sku; })[0];
}

function viewBag() {
  var b = S.bag, it = bagItem();
  var no = '<span class="baono">' + (b.baoNo || '…') + '</span>';
  var q = (b.q || '').toLowerCase();
  var list = S.detail.items.filter(function (i) {
    return !q || (i.barcode + ' ' + i.sku + ' ' + i.phanLoai).toLowerCase().indexOf(q) >= 0;
  }).sort(function (x, y) { return (x.slDong >= x.slCan) - (y.slDong >= y.slCan); });
  var picks = list.map(function (i) {
    var full = i.slDong >= i.slCan;
    var act = i.twin ? 'pickTwinFromList' : 'pickSku';   // hàng chung barcode: mở bảng chọn đúng loại
    return '<button type="button" class="pick ' + (b.sku === i.sku ? 'on' : '') + (full ? ' dim' : '') + '" onclick="' + act + '(\'' + esc(i.sku) + '\')">' +
      '<div class="bold" style="font-size:14px">' + esc(i.barcode || i.sku) + '</div>' +
      plLine(i) + twinTag(i) +
      '<div class="muted small">SKU ' + esc(i.sku) + '</div>' +
      '<div class="small bold" style="margin-top:4px">Cần ' + i.slCan + ' · Đã đóng ' + i.slDong + ' · Còn ' + Math.max(0, i.slCan - i.slDong) + '</div></button>';
  }).join('');

  var vid = vidBox(b);

  var thumbs = b.photos.map(function (p, n) {
    return '<div style="position:relative">' + (p.thumb ? '<img src="' + p.thumb + '" alt="Ảnh bao">' : '<div class="nothumb">Ảnh ' + (n + 1) + '</div>') +
      (p.id ? '' : '<div class="small muted center">đang tải…</div>') +
      (b.mode && p.id ? '<button type="button" class="delph" aria-label="Xóa ảnh" onclick="removePhoto(' + n + ')">✕</button>' : '') + '</div>';
  }).join('');

  var dong = it ? bagDong(it) : 0;
  var left = it ? Math.max(0, it.slCan - dong) : 0;
  var head = b.mode === 'edit' ? 'Sửa bao số ' : (b.mode === 'manual' ? 'Thêm bao số ' : 'Bao số ');
  var moreOpen = b.danTem || b.xuatTrucTiep || b.xuatSSC || b.maDonSSC || b.slGoiThem || b.tinhTrang;
  render('<div class="wrap stack" style="max-width:640px;padding-bottom:180px">' +
    '<div class="row"><button type="button" class="iconbtn" aria-label="Hủy bao" onclick="cancelBag()">' + ICON.back + '</button>' +
    '<div class="grow"><div class="eyebrow" style="word-break:break-all">' + esc(poName(S.detail.lot)) + '</div><div class="title">' + head + no + '</div></div>' +
    '<span class="chip soft">Mã kiện ' + no + '</span></div>' +

    '<div class="card stack"><h3 style="margin:0"><span class="stepno">01</span>Chọn hàng &amp; số lượng</h3>' +
    (it ? '<div class="pick on"><div class="bagsku"><div class="grow"><div class="nm">' + esc(it.barcode || it.sku) + '</div>' +
      (it.twin ? '<div class="plbig">' + plHtml(it.phanLoai) + '</div><div class="small" style="color:var(--text2)">' + esc(it.ten) + '</div>' + twinTag(it)
        : '<div class="small" style="color:var(--text2)">' + esc(it.ten) + ' · ' + esc(it.phanLoai) + '</div>') +
      '<div class="muted small">SKU ' + esc(it.sku) + '</div></div>' +
      '<button type="button" class="btn sm" onclick="S.bag.sku=null;S.bag.scanCode=null;viewBag()">Đổi</button></div>' +
      '<div class="need"><div>Cần<b>' + it.slCan + '</b></div><div>' + (b.mode === 'edit' ? 'Bao khác đã đóng' : 'Đã đóng') + '<b>' + dong + '</b></div><div class="left">Còn<b>' + left + '</b></div></div></div>' +
      (b.scanCode && S.codes[b.scanCode] ? '<div class="small muted">Chọn bằng mã quét ' + esc(b.scanCode) +
        (isAdmin() ? ' · <a href="#" onclick="showCodeChooser(\'' + esc(b.scanCode) + '\');return false">Sai hàng? Ghép lại</a>'
          : ' · Sai hàng? Báo quản trị viên') + '</div>' : '') +
      '<div class="qtyrow"><span class="lb">Số lượng<br>trong bao</span><div class="stepper grow">' +
      '<button type="button" class="btn" aria-label="Giảm" onclick="stepQty(-1)">−</button>' +
      '<input class="in grow" type="number" inputmode="numeric" min="1" id="bqty" aria-label="Số lượng" value="' + esc(b.qty) + '" oninput="S.bag.qty=this.value">' +
      '<button type="button" class="btn" aria-label="Tăng" onclick="stepQty(1)">+</button></div></div>'
      : '<div class="row"><input class="in grow" type="search" placeholder="Gõ barcode để tìm, ví dụ DN-P-2" value="' + esc(b.q) + '" oninput="S.bag.q=this.value;filterPicks()" id="bq">' +
        (CAN_SCAN ? '<button type="button" class="btn scanbtn" onclick="openScanner()" aria-label="Quét mã bằng camera">' + ICON.scan + 'Quét mã</button>' : '') + '</div>' +
        '<div class="stack" id="picks" style="gap:8px">' + picks + '</div>') + '</div>' +

    '<div class="card stack"><h3 style="margin:0"><span class="stepno">02</span>Video đóng hàng ' + (b.mode ? '<span class="chip soft" style="margin-left:6px">Không bắt buộc</span>' : '<span class="chip bad" style="margin-left:6px">Bắt buộc</span>') + '</h3>' + vid + '</div>' +

    '<div class="card stack"><h3 style="margin:0"><span class="stepno">03</span>Ảnh bao hàng</h3>' +
    '<div class="thumbs">' + thumbs + '<button type="button" class="add" aria-label="Chụp ảnh" onclick="$(\'pfile\').click()">' + ICON.cam + '</button></div></div>' +

    '<details class="more"' + (moreOpen ? ' open' : '') + '><summary><span class="stepno">04</span>Thông tin thêm <span class="muted small" style="font-weight:600;margin-left:6px">không bắt buộc</span></summary><div class="stack">' +
    '<label class="check"><input type="checkbox" ' + (b.danTem ? 'checked' : '') + ' onchange="S.bag.danTem=this.checked">Dán tem</label>' +
    '<label class="check"><input type="checkbox" ' + (b.xuatTrucTiep ? 'checked' : '') + ' onchange="S.bag.xuatTrucTiep=this.checked">Xuất hàng trực tiếp</label>' +
    '<label class="check"><input type="checkbox" ' + (b.xuatSSC ? 'checked' : '') + ' onchange="S.bag.xuatSSC=this.checked">Xuất hàng SSC</label>' +
    '<div class="grid2"><label class="f">Mã đơn xuất SSC<input class="in" value="' + esc(b.maDonSSC) + '" oninput="S.bag.maDonSSC=this.value" placeholder="Nếu có"></label>' +
    '<label class="f">SL cần gọi thêm<input class="in" type="number" inputmode="numeric" value="' + esc(b.slGoiThem) + '" oninput="S.bag.slGoiThem=this.value" placeholder="0"></label></div>' +
    '<label class="f">Tình trạng<select class="in" onchange="S.bag.tinhTrang=this.value"><option value="">Chọn…</option>' +
    S.tinhTrang.map(function (t) { return '<option' + (b.tinhTrang === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></label></div></details>' +
    '</div>' +
    '<input type="file" id="vfile" accept="video/*" hidden onchange="gotVideoFile(this)">' +
    '<input type="file" id="vcap" accept="video/*" capture="environment" hidden onchange="gotVideoFile(this)">' +
    '<input type="file" id="pfile" accept="image/*" capture="environment" hidden onchange="gotPhotos(this)">' +
    '<div class="sticky"><div class="inner"><button type="button" class="btn pri block" onclick="saveBag()">' + (b.mode === 'edit' ? '✓ Lưu thay đổi bao số ' : (b.mode === 'manual' ? '✓ Lưu bao số ' : '✓ Chốt bao số ')) + no + '</button></div></div>' +
    nav('lots'));
}

function filterPicks() {
  var y = window.scrollY; viewBag();
  var el = $('bq'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  window.scrollTo(0, y);
}
function pickSku(sku) {
  S.bag.sku = sku;
  var it = bagItem();
  if (it && !S.bag.qty) S.bag.qty = Math.max(0, it.slCan - it.slDong) || '';
  viewBag();
}
function stepQty(n) {
  var v = Math.max(0, (Number($('bqty').value) || 0) + n);
  S.bag.qty = v; $('bqty').value = v;
}

function cancelBag() {
  if (S.bag && S.bag.mode === 'edit') {
    return ask('Bỏ các thay đổi của bao số ' + S.bag.baoNo + '? Bao giữ nguyên như cũ.', { ok: 'Bỏ thay đổi' }).then(function (ok) {
      if (!ok || !S.bag) return;
      var bag = S.bag; S.bag = null;
      VQ.jobs.filter(function (j) { return j.bagId === bag.bagId && !j.saved; }).forEach(vqDrop);
      showLot(S.lotCache[S.lotId] || S.detail);
    });
  }
  ask('Hủy bao số ' + (S.bag.baoNo || '') + '? Thông tin đã nhập' + (S.bag.job || S.bag.videoId ? ' và video' : '') + ' sẽ mất.', { ok: 'Hủy bao', danger: true }).then(function (ok) {
    if (!ok || !S.bag) return;
    var bag = S.bag, lotId = S.lotId; S.bag = null;
    if (bag.job) { vqDrop(bag.job); bag.job = null; }
    VQ.jobs.filter(function (j) { return j.bagId && j.bagId === bag.bagId; }).forEach(vqDrop);
    showLot(S.lotCache[lotId] || S.detail);   // quay về lô ngay, báo hủy chạy ngầm
    bag.ready.then(function () { return call('cancelBag', { bagId: bag.bagId }, { quiet: true, silent: true }); })
      .then(function (d) {
        if (!d || !d.lot) return;
        S.lotCache[d.lot.lotId] = d;
        if (S.view === 'lot' && S.lotId === d.lot.lotId && !S.bag && !editing()) { S.detail = d; viewLot(true); }
      }).catch(function () { /* bao nháp còn trên máy chủ, lần sau hiện "đang đóng dở" */ });
  });
}

function saveBag() {
  var b = S.bag;
  if (!b.bagId) return toast('Đang lấy số bao, chờ 1–2 giây rồi bấm lại nhé.', true);
  if (!b.sku) return toast('Chưa chọn SKU.', true);
  if (!(Number(b.qty) > 0)) return toast('Chưa nhập số lượng.', true);
  if (b.job && b.job.status === 'hold') return toast('Video bị gián đoạn: chọn "Giữ đoạn đã quay" hoặc "Quay lại từ đầu" trước.', true);
  if (!b.mode && !b.videoId && !(b.job && b.job.keep)) return toast('Bao chưa có video.', true);
  if (b.photos.some(function (p) { return !p.id; })) return toast('Ảnh đang tải lên, chờ chút nhé.', true);
  var it = bagItem();
  var over = it && bagDong(it) + Number(b.qty) > it.slCan;
  var msg = !over ? '' : 'Tổng số lượng sẽ vượt số lượng cần (' + it.slCan + ').' +
    (it.twin ? ' Barcode ' + it.barcode + ' dùng chung cho nhiều loại — kiểm tra lại đã chọn đúng phân loại "' + it.phanLoai + '" chưa.' : '') + ' Vẫn chốt?';
  (over ? ask(msg) : Promise.resolve(true)).then(function (ok) {
    if (!ok) return;
    if (b.mode === 'edit') doEditBag(b); else doSaveBag(b);
  });
}
function doSaveBag(b) {
  var vid = b.videoId || '';   // video lúc bấm chốt (video có thể tải xong ngay trong lúc chờ máy chủ)
  call('saveBag', {
    bagId: b.bagId, sku: b.sku, qty: Number(b.qty), videoId: vid, videoPending: !vid && !!(b.job && b.job.keep), manual: b.mode === 'manual',

    maDonSSC: b.maDonSSC, slGoiThem: b.slGoiThem, tinhTrang: b.tinhTrang
  }, { text: 'Đang chốt bao…' }).then(function (r) {
    S.bag = null;
    VQ.jobs.filter(function (j) { return j.bagId === b.bagId && !j.dead; }).forEach(function (j) {
      if (vid && j.fileId === vid) return vqDrop(j);   // video đã gắn thẳng vào bao

    });

}

/* ---------- Quét barcode / QR bằng camera để chọn hàng (bước 01) ---------- */
/* Dùng thư viện html5-qrcode (đọc cả mã vạch 1D và QR, chạy được trên iPhone lẫn Android), chỉ tải khi bấm "Quét mã". */
var CAN_SCAN = !!window.GODFBS_WEB && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
var SCAN_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
var SCAN = null, scanLibP = null;
function loadScanLib() {
  if (window.Html5Qrcode) return Promise.resolve();
  if (scanLibP) return scanLibP;
  scanLibP = new Promise(function (resolve, reject) {
    var s = document.createElement('script'); s.src = SCAN_LIB; s.onload = resolve;
    s.onerror = function () { scanLibP = null; reject(new Error('Không tải được bộ quét mã, kiểm tra mạng rồi thử lại.')); };
    document.head.appendChild(s);
  });

}
function openScanner() {
  if (SCAN) return;
  refreshCodes();   // lấy bảng ghép mã mới nhất (người khác vừa ghép) trong lúc mở camera
  var box = document.createElement('div');
  box.className = 'scanbox'; box.id = 'scanbox';
  box.innerHTML = '<div class="scanhead"><div class="bold">Quét barcode / mã QR</div>' +
    '<button type="button" class="btn sm" onclick="closeScanner()">Đóng</button></div>' +
    '<div id="scanview" class="scanview"></div>' +
    '<div class="scanhint" id="scanhint">Đưa mã vạch vào giữa khung, giữ yên tay…</div>';
  document.body.appendChild(box);
  SCAN = { qr: null, done: false };
  loadScanLib().then(function () {
    if (!SCAN) return;
    var cfg = { fps: 12, qrbox: function (w, h) { var s = Math.min(w, h); return { width: Math.round(Math.min(w * 0.85, 340)), height: Math.round(s * 0.5) }; },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
    SCAN.qr = new Html5Qrcode('scanview', { verbose: false });
    return SCAN.qr.start({ facingMode: 'environment' }, cfg, gotScan, function () {});
  }).catch(function (e) {
    var name = (e && e.name) || String(e || '');
    closeScanner();
    toast(/NotAllowed|Permission/i.test(name)
      ? 'Trình duyệt đang chặn camera. Vào cài đặt cho phép Camera rồi tải lại trang.'

}
function closeScanner() {
  var s = SCAN; SCAN = null;

  rm();
}
function foldQ(v) { return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase(); }
function filterSkuList(v, lotId) {

  cards.forEach(function (c) { var ok = !q || c.getAttribute('data-q').indexOf(q) >= 0; c.style.display = ok ? '' : 'none'; if (ok) n++; });
  var m = document.getElementById('skuqn');
  if (m) { m.style.display = q ? '' : 'none'; m.textContent = n ? 'Thấy ' + n + ' SKU' : 'Không thấy SKU nào khớp'; }
}
function normCode(v) { return String(v || '').trim().toUpperCase().replace(/\s+/g, ''); }

/* Bảng ghép mã: dãy số in trên bao bì → barcode chữ trong PO. Lưu trên máy chủ (dùng chung mọi người), nhớ tạm trên máy. */
S.codes = (function () { try { return JSON.parse(load('godfbs_codes') || '{}') || {}; } catch (e) { return {}; } })();
function refreshCodes() {
  return call('listCodes', {}, { quiet: true, silent: true }).then(function (list) {
    var m = {}; list.forEach(function (r) { m[normCode(r.code)] = { barcode: r.barcode, sku: r.sku }; });
    S.codes = m; store('godfbs_codes', JSON.stringify(m));
  }).catch(function () { /* mất mạng thì dùng bảng đã nhớ */ });
}
/**
 * Các hàng trong lô khớp với mã vừa quét.
 * - Quét QR mã SKU (Warehouse SKU ID): đúng 1 hàng.
 * - Quét barcode (hoặc mã bao bì đã ghép): MỌI SKU dùng barcode đó (bản thường + Premium…) → nhiều hàng thì phải hỏi.

function itemsByCode(code) {
  if (!S.detail) return [];
  var items = S.detail.items;
  var bySku = items.filter(function (i) { return normCode(i.sku) === code; });
  if (bySku.length) return bySku;
  var bc = items.some(function (i) { return normCode(i.barcode) === code; }) ? code : '';
  var m = S.codes[code];
  if (!bc && m) {
    bc = normCode(m.barcode);
    if (!bc || !items.some(function (i) { return normCode(i.barcode) === bc; })) {
      return items.filter(function (i) { return m.sku && String(i.sku) === String(m.sku); });
    }
  }
  return bc ? items.filter(function (i) { return normCode(i.barcode) === bc; }) : [];
}

function gotScan(text) {
  if (!SCAN || SCAN.done || !S.bag || !S.detail) return;
  var code = normCode(text);
  var hits = itemsByCode(code);
  if (hits.length) {
    SCAN.done = true;
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) { /* bỏ qua */ }
    if (hits.length > 1) return showTwinChooser(code, hits);   // barcode dùng chung: bắt chọn đúng loại
    closeScanner();
    choseScanned(code, hits[0]);
    return;
  }
  var m = S.codes[code];
  if (m) {   // đã ghép nhưng hàng đó không có trong PO đang đóng
    var h = $('scanhint');
    if (h && h.getAttribute('data-code') !== code) {
      h.setAttribute('data-code', code);
      h.innerHTML = 'Mã <b>' + esc(code) + '</b> là hàng <b>' + esc(m.barcode || m.sku) + '</b>, không có trong PO này.' +
        (isAdmin() ? '<div style="margin-top:8px"><button type="button" class="btn sm" onclick="showCodeChooser(\'' + esc(code) + '\')">Ghép lại cho hàng khác</button></div>' : '');
    }
    return;
  }
  // Mã mới chưa ghép: quản trị viên thì hỏi đây là hàng nào; nhân viên thì báo chưa có mã, chọn tay
  SCAN.done = true;
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) { /* bỏ qua */ }

}
